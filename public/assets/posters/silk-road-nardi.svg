<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="brightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="300" height="300" fill="url(#bgGrad)" />
  <circle cx="150" cy="140" r="110" fill="#f59e0b" opacity="0.15" filter="url(#brightGlow)" />

  <!-- Uzbekistan Tag -->
  <g transform="translate(18, 20)">
    <rect width="32" height="6" fill="#0284c7" rx="1.5" />
    <rect y="6" width="32" height="6" fill="#ffffff" />
    <rect y="12" width="32" height="6" fill="#16a34a" rx="1.5" />
  </g>

  <!-- Inlaid Nardi Board & Dice -->
  <g transform="translate(150, 140)">
    <!-- Backgammon Points -->
    <polygon points="-80,-45 -65,30 -50,-45" fill="#ca8a04" opacity="0.8"/>
    <polygon points="-50,-45 -35,30 -20,-45" fill="#451a03" opacity="0.8"/>
    <polygon points="20,-45 35,30 50,-45" fill="#ca8a04" opacity="0.8"/>
    <polygon points="50,-45 65,30 80,-45" fill="#451a03" opacity="0.8"/>

    <!-- Checkers -->
    <circle cx="-35" cy="0" r="14" fill="#facc15" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="35" cy="0" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>

    <!-- Pair of 3D Dice (Shesh-Besh 6 and 5) -->
    <!-- Die 1 (6) -->
    <g transform="translate(-18, 20)">
      <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#brightGlow)"/>
      <circle cx="-7" cy="-7" r="2.5" fill="#dc2626"/>
      <circle cx="-7" cy="0" r="2.5" fill="#dc2626"/>
      <circle cx="-7" cy="7" r="2.5" fill="#dc2626"/>
      <circle cx="7" cy="-7" r="2.5" fill="#dc2626"/>
      <circle cx="7" cy="0" r="2.5" fill="#dc2626"/>
      <circle cx="7" cy="7" r="2.5" fill="#dc2626"/>
    </g>

    <!-- Die 2 (5) -->
    <g transform="translate(20, 24) rotate(15)">
      <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#brightGlow)"/>
      <circle cx="-7" cy="-7" r="2.5" fill="#0f172a"/>
      <circle cx="7" cy="-7" r="2.5" fill="#0f172a"/>
      <circle cx="0" cy="0" r="2.5" fill="#0f172a"/>
      <circle cx="-7" cy="7" r="2.5" fill="#0f172a"/>
      <circle cx="7" cy="7" r="2.5" fill="#0f172a"/>
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(150, 260)">
    <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="4" font-family="'Orbitron', sans-serif" font-weight="900" font-size="12" fill="#fde68a" text-anchor="middle" letter-spacing="2">SILK ROAD NARDI</text>
  </g>
</svg>
