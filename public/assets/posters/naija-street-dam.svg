<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="brightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="300" height="300" fill="url(#bgGrad)" />
  <circle cx="150" cy="140" r="110" fill="#3b82f6" opacity="0.15" filter="url(#brightGlow)" />

  <!-- Nigeria & Ghana Tri-Accent -->
  <g transform="translate(18, 20)">
    <rect width="10" height="18" fill="#16a34a" />
    <rect x="10" width="10" height="18" fill="#ffffff" />
    <rect x="20" width="10" height="18" fill="#16a34a" />
  </g>

  <!-- Checkered Board Grid & Flying King -->
  <g transform="translate(150, 140)">
    <!-- 4x4 Mini Board Preview -->
    <rect x="-60" y="-60" width="120" height="120" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="3" filter="url(#glow)"/>
    <rect x="-60" y="-60" width="30" height="30" fill="#334155"/>
    <rect x="0" y="-60" width="30" height="30" fill="#334155"/>
    <rect x="-30" y="-30" width="30" height="30" fill="#334155"/>
    <rect x="30" y="-30" width="30" height="30" fill="#334155"/>
    <rect x="-60" y="0" width="30" height="30" fill="#334155"/>
    <rect x="0" y="0" width="30" height="30" fill="#334155"/>
    <rect x="-30" y="30" width="30" height="30" fill="#334155"/>
    <rect x="30" y="30" width="30" height="30" fill="#334155"/>

    <!-- Red Piece -->
    <circle cx="-15" cy="-15" r="13" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>

    <!-- White Flying King Piece with Crown -->
    <circle cx="15" cy="15" r="16" fill="#ffffff" stroke="#38bdf8" stroke-width="3" filter="url(#brightGlow)"/>
    <text x="15" y="21" font-size="14" text-anchor="middle">👑</text>

    <!-- Flying Diagonal Trail -->
    <line x1="-40" y1="-40" x2="15" y2="15" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4" filter="url(#brightGlow)"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(150, 260)">
    <rect x="-90" y="-14" width="180" height="26" rx="13" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="4" font-family="'Orbitron', sans-serif" font-weight="900" font-size="11" fill="#93c5fd" text-anchor="middle" letter-spacing="1.5">NAIJA STREET DAM</text>
  </g>
</svg>
