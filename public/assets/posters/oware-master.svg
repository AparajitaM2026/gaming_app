<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#290f04" />
      <stop offset="100%" stop-color="#0f0502" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="brightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="300" height="300" fill="url(#bgGrad)" />
  <circle cx="150" cy="140" r="110" fill="#f59e0b" opacity="0.12" filter="url(#brightGlow)" />

  <!-- Ghana Flag Ribbon Tag -->
  <g transform="translate(18, 20)">
    <rect width="36" height="7" fill="#ef4444" rx="2" />
    <rect y="7" width="36" height="7" fill="#eab308" />
    <rect y="14" width="36" height="7" fill="#22c55e" rx="2" />
    <polygon points="18,7 20,11 24,11 21,13 22,17 18,14 14,17 15,13 12,11 16,11" fill="#000000" transform="scale(0.7) translate(8, 3)" />
  </g>

  <!-- Carved Wooden Oware Board -->
  <g transform="translate(150, 140)">
    <rect x="-115" y="-60" width="230" height="120" rx="24" fill="#78350f" stroke="#d97706" stroke-width="3" filter="url(#glow)"/>
    
    <!-- 12 Pits (2 rows of 6) -->
    <!-- Top Row -->
    <circle cx="-85" cy="-28" r="14" fill="#1c0a03" stroke="#451a03" stroke-width="2"/>
    <circle cx="-51" cy="-28" r="14" fill="#1c0a03" stroke="#451a03" stroke-width="2"/>
    <circle cx="-17" cy="-28" r="14" fill="#1c0a03" stroke="#451a03" stroke-width="2"/>
    <circle cx="17" cy="-28" r="14" fill="#1c0a03" stroke="#451a03" stroke-width="2"/>
    <circle cx="51" cy="-28" r="14" fill="#1c0a03" stroke="#451a03" stroke-width="2"/>
    <circle cx="85" cy="-28" r="14" fill="#1c0a03" stroke="#451a03" stroke-width="2"/>

    <!-- Bottom Row -->
    <circle cx="-85" cy="28" r="14" fill="#1c0a03" stroke="#451a03" stroke-width="2"/>
    <circle cx="-51" cy="28" r="14" fill="#1c0a03" stroke="#451a03" stroke-width="2"/>
    <circle cx="-17" cy="28" r="14" fill="#1c0a03" stroke="#451a03" stroke-width="2"/>
    <circle cx="17" cy="28" r="14" fill="#1c0a03" stroke="#451a03" stroke-width="2"/>
    <circle cx="51" cy="28" r="14" fill="#1c0a03" stroke="#451a03" stroke-width="2"/>
    <circle cx="85" cy="28" r="14" fill="#1c0a03" stroke="#451a03" stroke-width="2"/>

    <!-- Glowing Seed Beads -->
    <circle cx="-17" cy="26" r="4.5" fill="#fde047" filter="url(#glow)"/>
    <circle cx="-14" cy="32" r="4.5" fill="#fde047"/>
    <circle cx="-21" cy="30" r="4.5" fill="#ca8a04"/>
    <circle cx="17" cy="28" r="5" fill="#fde047" filter="url(#brightGlow)"/>
    <circle cx="51" cy="-28" r="4.5" fill="#fde047"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(150, 260)">
    <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#290f04" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="4" font-family="'Orbitron', sans-serif" font-weight="900" font-size="12" fill="#fde68a" text-anchor="middle" letter-spacing="2">OWARE MASTER</text>
  </g>
</svg>
