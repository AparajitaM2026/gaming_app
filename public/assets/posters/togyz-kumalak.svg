<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="50%" stop-color="#0e4e5b" />
      <stop offset="100%" stop-color="#02161e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="brightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="300" height="300" fill="url(#bgGrad)" />
  <circle cx="150" cy="140" r="110" fill="#06b6d4" opacity="0.15" filter="url(#brightGlow)" />

  <!-- Kazakh Golden Sun & Steppe Eagle Accent -->
  <g transform="translate(18, 20)">
    <circle cx="16" cy="12" r="7" fill="#facc15" filter="url(#glow)"/>
    <path d="M 6,18 Q 16,13 26,18 Q 16,16 6,18 Z" fill="#facc15"/>
  </g>

  <!-- Togyz Kumalak Board -->
  <g transform="translate(150, 140)">
    <rect x="-125" y="-65" width="250" height="130" rx="20" fill="#08333c" stroke="#14b8a6" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Kazans (Storage center) -->
    <rect x="-110" y="-12" width="100" height="24" rx="8" fill="#042026" stroke="#0d9488" stroke-width="1.5"/>
    <rect x="10" y="-12" width="100" height="24" rx="8" fill="#042026" stroke="#0d9488" stroke-width="1.5"/>

    <!-- Pits (9 per row) -->
    <g fill="#021317" stroke="#115e59" stroke-width="1.5">
      <!-- Top Row -->
      <circle cx="-105" cy="-40" r="9"/>
      <circle cx="-79" cy="-40" r="9"/>
      <circle cx="-53" cy="-40" r="9"/>
      <circle cx="-27" cy="-40" r="9"/>
      <circle cx="-1" cy="-40" r="9"/>
      <circle cx="25" cy="-40" r="9"/>
      <circle cx="51" cy="-40" r="9"/>
      <circle cx="77" cy="-40" r="9"/>
      <circle cx="103" cy="-40" r="9"/>

      <!-- Bottom Row -->
      <circle cx="-105" cy="40" r="9"/>
      <circle cx="-79" cy="40" r="9"/>
      <circle cx="-53" cy="40" r="9"/>
      <circle cx="-27" cy="40" r="9"/>
      <circle cx="-1" cy="40" r="9"/>
      <circle cx="25" cy="40" r="9"/>
      <circle cx="51" cy="40" r="9"/>
      <circle cx="77" cy="40" r="9"/>
      <circle cx="103" cy="40" r="9"/>
    </g>

    <!-- Kumalaks (Balls) -->
    <circle cx="-27" cy="40" r="3.5" fill="#5eead4" filter="url(#brightGlow)"/>
    <circle cx="51" cy="-40" r="3.5" fill="#5eead4" filter="url(#brightGlow)"/>
    <circle cx="-60" cy="0" r="4.5" fill="#facc15" filter="url(#glow)"/>
    <circle cx="60" cy="0" r="4.5" fill="#facc15" filter="url(#glow)"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(150, 260)">
    <rect x="-95" y="-14" width="190" height="26" rx="13" fill="#042026" stroke="#14b8a6" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="4" font-family="'Orbitron', sans-serif" font-weight="900" font-size="11" fill="#a5f3fc" text-anchor="middle" letter-spacing="1.5">TOGYZ KUMALAK</text>
  </g>
</svg>
