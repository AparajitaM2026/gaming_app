<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#021716" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="brightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="300" height="300" fill="url(#bgGrad)" />
  <circle cx="150" cy="140" r="110" fill="#14b8a6" opacity="0.15" filter="url(#brightGlow)" />

  <!-- Kazakhstan Sun Tag -->
  <g transform="translate(18, 20)">
    <circle cx="14" cy="12" r="6" fill="#facc15" filter="url(#glow)"/>
    <path d="M 4,18 Q 14,14 24,18 Z" fill="#facc15"/>
  </g>

  <!-- Clashing Riders & Wrestling Grip -->
  <g transform="translate(150, 140)">
    <!-- Central Arena Ring -->
    <ellipse cx="0" cy="20" rx="90" ry="35" fill="none" stroke="#14b8a6" stroke-width="2" stroke-dasharray="6 4" filter="url(#glow)"/>

    <!-- Left Rider (Green) -->
    <circle cx="-40" cy="0" r="26" fill="#059669" stroke="#ffffff" stroke-width="3" filter="url(#brightGlow)"/>
    <text x="-40" y="8" font-size="24" text-anchor="middle">🏇</text>

    <!-- Clash Sparks -->
    <text x="0" y="-8" font-size="28" fill="#facc15" text-anchor="middle" filter="url(#brightGlow)">⚔️</text>

    <!-- Right Rider (Red) -->
    <circle cx="40" cy="0" r="26" fill="#dc2626" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
    <text x="40" y="8" font-size="24" text-anchor="middle" transform="scale(-1, 1) translate(-80, 0)">🏇</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(150, 260)">
    <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="4" font-family="'Orbitron', sans-serif" font-weight="900" font-size="11" fill="#99f6e4" text-anchor="middle" letter-spacing="1.5">AUDARYSPAK</text>
  </g>
</svg>
