<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="brightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="300" height="300" fill="url(#bgGrad)" />
  <circle cx="150" cy="140" r="110" fill="#2dd4bf" opacity="0.15" filter="url(#brightGlow)" />

  <!-- Kazakhstan Sun Tag -->
  <g transform="translate(18, 20)">
    <circle cx="14" cy="12" r="6" fill="#facc15" filter="url(#glow)"/>
    <path d="M 4,18 Q 14,14 24,18 Z" fill="#facc15"/>
  </g>

  <!-- Galloping Steppe Stallion & Kazan Ring -->
  <g transform="translate(150, 140)">
    <!-- Kazan Goal Circle in distance -->
    <ellipse cx="0" cy="-35" rx="50" ry="20" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#glow)"/>
    <text x="0" y="-31" font-family="'Orbitron', sans-serif" font-weight="900" font-size="10" fill="#a7f3d0" text-anchor="middle">KAZAN</text>

    <!-- Speed Gallop Trails -->
    <path d="M -40,30 Q -10,0 0,-15" stroke="#facc15" stroke-width="3" stroke-linecap="round" filter="url(#brightGlow)"/>
    <path d="M 40,30 Q 10,0 0,-15" stroke="#facc15" stroke-width="3" stroke-linecap="round" filter="url(#brightGlow)"/>

    <!-- Stallion Rider Icon -->
    <circle cx="0" cy="20" r="28" fill="#b45309" stroke="#ffffff" stroke-width="3" filter="url(#brightGlow)"/>
    <text x="0" y="28" font-size="28" text-anchor="middle">🐎</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(150, 260)">
    <rect x="-95" y="-14" width="190" height="26" rx="13" fill="#022c22" stroke="#10b981" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="4" font-family="'Orbitron', sans-serif" font-weight="900" font-size="11" fill="#a7f3d0" text-anchor="middle" letter-spacing="1.5">KOKPAR NOMAD</text>
  </g>
</svg>
