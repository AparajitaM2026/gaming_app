<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#2a0d02" />
      <stop offset="100%" stop-color="#0e0401" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="brightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="300" height="300" fill="url(#bgGrad)" />
  <circle cx="150" cy="140" r="110" fill="#ea580c" opacity="0.15" filter="url(#brightGlow)" />

  <!-- Zambia Flag Tag -->
  <g transform="translate(18, 20)">
    <rect width="26" height="20" fill="#15803d" rx="2" />
    <rect x="26" width="4" height="20" fill="#dc2626" />
    <rect x="30" width="4" height="20" fill="#000000" />
    <rect x="34" width="4" height="20" fill="#ea580c" rx="2" />
  </g>

  <!-- 4-Row Nsolo Board -->
  <g transform="translate(150, 140)">
    <rect x="-115" y="-65" width="230" height="130" rx="20" fill="#78350f" stroke="#ea580c" stroke-width="3" filter="url(#glow)"/>
    
    <!-- 4 Rows of 6 Pits -->
    <g fill="#1c0a03" stroke="#451a03" stroke-width="1.5">
      <!-- Row 1 -->
      <circle cx="-75" cy="-45" r="9"/>
      <circle cx="-45" cy="-45" r="9"/>
      <circle cx="-15" cy="-45" r="9"/>
      <circle cx="15" cy="-45" r="9"/>
      <circle cx="45" cy="-45" r="9"/>
      <circle cx="75" cy="-45" r="9"/>

      <!-- Row 2 -->
      <circle cx="-75" cy="-15" r="9"/>
      <circle cx="-45" cy="-15" r="9"/>
      <circle cx="-15" cy="-15" r="9"/>
      <circle cx="15" cy="-15" r="9"/>
      <circle cx="45" cy="-15" r="9"/>
      <circle cx="75" cy="-15" r="9"/>

      <!-- Row 3 -->
      <circle cx="-75" cy="15" r="9"/>
      <circle cx="-45" cy="15" r="9"/>
      <circle cx="-15" cy="15" r="9"/>
      <circle cx="15" cy="15" r="9"/>
      <circle cx="45" cy="15" r="9"/>
      <circle cx="75" cy="15" r="9"/>

      <!-- Row 4 -->
      <circle cx="-75" cy="45" r="9"/>
      <circle cx="-45" cy="45" r="9"/>
      <circle cx="-15" cy="45" r="9"/>
      <circle cx="15" cy="45" r="9"/>
      <circle cx="45" cy="45" r="9"/>
      <circle cx="75" cy="45" r="9"/>
    </g>

    <!-- Copper Seed Accents -->
    <circle cx="-15" cy="15" r="4" fill="#fb923c" filter="url(#brightGlow)"/>
    <circle cx="45" cy="-15" r="4" fill="#fb923c" filter="url(#brightGlow)"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(150, 260)">
    <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#2a0d02" stroke="#ea580c" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="4" font-family="'Orbitron', sans-serif" font-weight="900" font-size="12" fill="#fdba74" text-anchor="middle" letter-spacing="2">NSOLO ZAMBIA</text>
  </g>
</svg>
