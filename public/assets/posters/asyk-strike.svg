<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="brightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="300" height="300" fill="url(#bgGrad)" />
  <circle cx="150" cy="140" r="110" fill="#f59e0b" opacity="0.15" filter="url(#brightGlow)" />

  <!-- Yurt / Steppe Pattern Ring -->
  <circle cx="150" cy="135" r="75" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8 6" filter="url(#glow)"/>

  <!-- Target White Asyks in Circle -->
  <circle cx="150" cy="115" r="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="125" cy="140" r="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="175" cy="140" r="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>

  <!-- Speed Motion Trails -->
  <path d="M 150,225 L 150,175" stroke="#22c55e" stroke-width="4" stroke-dasharray="6 4" filter="url(#brightGlow)"/>

  <!-- Golden Saka Knucklebone Striker -->
  <g transform="translate(150, 185)">
    <circle cx="0" cy="0" r="18" fill="#facc15" stroke="#ffffff" stroke-width="3" filter="url(#brightGlow)"/>
    <circle cx="0" cy="0" r="6" fill="#ca8a04"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(150, 260)">
    <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="4" font-family="'Orbitron', sans-serif" font-weight="900" font-size="12" fill="#fde68a" text-anchor="middle" letter-spacing="2">ASYK STRIKE</text>
  </g>
</svg>
