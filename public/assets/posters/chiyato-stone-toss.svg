<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#2a0d02" />
      <stop offset="100%" stop-color="#0e0401" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="brightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="300" height="300" fill="url(#bgGrad)" />
  <circle cx="150" cy="140" r="110" fill="#ea580c" opacity="0.15" filter="url(#brightGlow)" />

  <!-- Zambia Tag -->
  <g transform="translate(18, 20)">
    <rect width="24" height="18" fill="#15803d" rx="2" />
    <rect x="24" width="4" height="18" fill="#dc2626" />
    <rect x="28" width="4" height="18" fill="#000000" />
    <rect x="32" width="4" height="18" fill="#ea580c" rx="2" />
  </g>

  <!-- Dirt Circle & Flying Stone -->
  <g transform="translate(150, 140)">
    <!-- Ground Circle -->
    <ellipse cx="0" cy="35" rx="75" ry="30" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#glow)"/>
    
    <!-- Ground Pebbles -->
    <circle cx="-35" cy="35" r="9" fill="#d97706" stroke="#fde68a" stroke-width="1.5"/>
    <circle cx="0" cy="45" r="9" fill="#d97706" stroke="#fde68a" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="9" fill="#d97706" stroke="#fde68a" stroke-width="1.5"/>

    <!-- Motion trail -->
    <path d="M 0,20 L 0,-30" stroke="#facc15" stroke-width="3" stroke-dasharray="4 4" filter="url(#brightGlow)"/>

    <!-- Flying Gold Stone -->
    <circle cx="0" cy="-40" r="18" fill="#facc15" stroke="#ffffff" stroke-width="2.5" filter="url(#brightGlow)"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(150, 260)">
    <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#2a0d02" stroke="#ea580c" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="4" font-family="'Orbitron', sans-serif" font-weight="900" font-size="12" fill="#fdba74" text-anchor="middle" letter-spacing="2">CHIYATO TOSS</text>
  </g>
</svg>
