<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="brightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="300" height="300" fill="url(#bgGrad)" />
  <circle cx="150" cy="140" r="110" fill="#facc15" opacity="0.15" filter="url(#brightGlow)" />

  <!-- Nigeria Tag -->
  <g transform="translate(18, 20)">
    <rect width="10" height="18" fill="#16a34a" />
    <rect x="10" width="10" height="18" fill="#ffffff" />
    <rect x="20" width="10" height="18" fill="#16a34a" />
  </g>

  <!-- Yellow Danfo Bus Graphic -->
  <g transform="translate(150, 140)">
    <!-- Yellow Bus Body -->
    <rect x="-45" y="-60" width="90" height="120" rx="14" fill="#facc15" stroke="#000000" stroke-width="3" filter="url(#brightGlow)"/>
    <!-- Black Stripes -->
    <rect x="-22" y="-60" width="12" height="120" fill="#0f172a"/>
    <rect x="10" y="-60" width="12" height="120" fill="#0f172a"/>
    <!-- Blue Windshield -->
    <rect x="-35" y="-50" width="70" height="28" rx="4" fill="#38bdf8"/>
    <!-- Headlights -->
    <circle cx="-32" cy="-55" r="4" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="32" cy="-55" r="4" fill="#ffffff" filter="url(#glow)"/>
    <!-- Speed streaks -->
    <line x1="-60" y1="20" x2="-60" y2="60" stroke="#facc15" stroke-width="3" stroke-dasharray="6 4"/>
    <line x1="60" y1="20" x2="60" y2="60" stroke="#facc15" stroke-width="3" stroke-dasharray="6 4"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(150, 260)">
    <rect x="-90" y="-14" width="180" height="26" rx="13" fill="#0f172a" stroke="#facc15" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="4" font-family="'Orbitron', sans-serif" font-weight="900" font-size="11" fill="#fde68a" text-anchor="middle" letter-spacing="1.5">DANFO RUSH</text>
  </g>
</svg>
