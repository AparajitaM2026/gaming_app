<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#01140e" />
    </linearGradient>
    <linearGradient id="ballGrad" x1="30%" y1="30%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="brightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="300" height="300" fill="url(#bgGrad)" />
  <circle cx="150" cy="140" r="110" fill="#10b981" opacity="0.15" filter="url(#brightGlow)" />

  <!-- Tri-Flag Ribbon (Nigeria, Ghana, Zambia) -->
  <g transform="translate(18, 18) scale(0.7)">
    <!-- Nigeria -->
    <rect width="8" height="18" fill="#16a34a" />
    <rect x="8" width="8" height="18" fill="#ffffff" />
    <rect x="16" width="8" height="18" fill="#16a34a" />
    <!-- Ghana -->
    <g transform="translate(30, 0)">
      <rect width="24" height="6" fill="#ef4444" />
      <rect y="6" width="24" height="6" fill="#eab308" />
      <rect y="12" width="24" height="6" fill="#22c55e" />
    </g>
    <!-- Zambia -->
    <g transform="translate(60, 0)">
      <rect width="18" height="18" fill="#15803d" />
      <rect x="18" width="3" height="18" fill="#dc2626" />
      <rect x="21" width="3" height="18" fill="#000000" />
      <rect x="24" width="3" height="18" fill="#ea580c" />
    </g>
  </g>

  <!-- Stadium Goal Post -->
  <g transform="translate(150, 120)">
    <polygon points="-110,-40 110,-40 120,40 -120,40" fill="#047857" fill-opacity="0.2" stroke="#34d399" stroke-width="3" filter="url(#glow)"/>
    <line x1="-60" y1="-40" x2="-65" y2="40" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="60" y1="-40" x2="65" y2="40" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- Flying Soccer Ball -->
  <g transform="translate(150, 175)">
    <circle cx="0" cy="0" r="32" fill="url(#ballGrad)" stroke="#f8fafc" stroke-width="2.5" filter="url(#brightGlow)"/>
    <polygon points="0,-12 11,-4 7,10 -7,10 -11,-4" fill="#0f172a"/>
    <line x1="0" y1="-12" x2="0" y2="-30" stroke="#334155" stroke-width="2"/>
    <line x1="11" y1="-4" x2="28" y2="-8" stroke="#334155" stroke-width="2"/>
    <line x1="7" y1="10" x2="20" y2="25" stroke="#334155" stroke-width="2"/>
    <line x1="-7" y1="10" x2="-20" y2="25" stroke="#334155" stroke-width="2"/>
    <line x1="-11" y1="-4" x2="-28" y2="-8" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(150, 260)">
    <rect x="-95" y="-14" width="190" height="26" rx="13" fill="#064e3b" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="4" font-family="'Orbitron', sans-serif" font-weight="900" font-size="11" fill="#a7f3d0" text-anchor="middle" letter-spacing="1.5">AFRICAN PENALTY</text>
  </g>
</svg>
