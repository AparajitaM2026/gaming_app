<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#01140e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="brightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="300" height="300" fill="url(#bgGrad)" />
  <circle cx="150" cy="140" r="110" fill="#10b981" opacity="0.15" filter="url(#brightGlow)" />

  <!-- Nigeria Tag -->
  <g transform="translate(18, 20)">
    <rect width="12" height="21" fill="#16a34a" rx="2" />
    <rect x="12" width="12" height="21" fill="#ffffff" />
    <rect x="24" width="12" height="21" fill="#16a34a" rx="2" />
  </g>

  <!-- Fanned Playing Cards -->
  <g transform="translate(150, 140)">
    <!-- Left Card (Ace of Spades) -->
    <g transform="rotate(-15) translate(-40, -50)">
      <rect width="55" height="85" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#glow)"/>
      <text x="8" y="20" font-family="'Orbitron', sans-serif" font-weight="900" font-size="16" fill="#0f172a">A♠</text>
      <text x="27" y="55" font-size="28" fill="#0f172a" text-anchor="middle">♠</text>
    </g>

    <!-- Right Card (King of Hearts) -->
    <g transform="rotate(15) translate(-10, -50)">
      <rect width="55" height="85" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#brightGlow)"/>
      <text x="8" y="20" font-family="'Orbitron', sans-serif" font-weight="900" font-size="16" fill="#dc2626">K♥</text>
      <text x="27" y="55" font-size="28" fill="#dc2626" text-anchor="middle">♥</text>
    </g>
  </g>

  <!-- Title Badge -->
  <g transform="translate(150, 260)">
    <rect x="-90" y="-14" width="180" height="26" rx="13" fill="#064e3b" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="4" font-family="'Orbitron', sans-serif" font-weight="900" font-size="11" fill="#a7f3d0" text-anchor="middle" letter-spacing="1.5">NAIJA WHIST 24</text>
  </g>
</svg>
