<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="brightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="300" height="300" fill="url(#bgGrad)" />
  <circle cx="150" cy="140" r="110" fill="#2dd4bf" opacity="0.15" filter="url(#brightGlow)" />

  <!-- Kazakhstan Sun Tag -->
  <g transform="translate(18, 20)">
    <circle cx="14" cy="12" r="6" fill="#facc15" filter="url(#glow)"/>
    <path d="M 4,18 Q 14,14 24,18 Z" fill="#facc15"/>
  </g>

  <!-- Two Galloping Horses Graphic -->
  <g transform="translate(150, 140)">
    <!-- Steppe Mountains silhouette -->
    <polygon points="-110,-10 -60,-45 0,-15 50,-50 110,-10 110,40 -110,40" fill="#064e3b" opacity="0.4"/>

    <!-- Maiden Horse (Ahead) -->
    <circle cx="45" cy="-5" r="22" fill="#e11d48" stroke="#ffffff" stroke-width="2.5" filter="url(#glow)"/>
    <text x="45" y="2" font-size="20" text-anchor="middle">💃</text>

    <!-- Hero Horse (Chasing) -->
    <circle cx="-35" cy="15" r="26" fill="#0284c7" stroke="#38bdf8" stroke-width="3" filter="url(#brightGlow)"/>
    <text x="-35" y="23" font-size="24" text-anchor="middle">🏇</text>

    <!-- Speed Dash -->
    <line x1="-80" y1="20" x2="-65" y2="20" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(150, 260)">
    <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#022c22" stroke="#2dd4bf" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="4" font-family="'Orbitron', sans-serif" font-weight="900" font-size="11" fill="#a5f3fc" text-anchor="middle" letter-spacing="1.5">KYZ KUU SPRINT</text>
  </g>
</svg>
