<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chaskele — Ghanaian Street Cricket &amp; Can Strike</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Inter:wght@400;600;700;800&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1c0a03;
      font-family: 'Inter', sans-serif;
      color: #fff;
      user-select: none;
      touch-action: none;
    }
    .cinzel { font-family: 'Cinzel', serif; }
    .orbitron { font-family: 'Orbitron', sans-serif; }

    #chaskeleCanvas {
      background: radial-gradient(circle at 50% 80%, #78350f 0%, #451a03 55%, #180601 100%);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.85);
    }
  </style>
</head>
<body class="h-full w-full flex flex-col justify-between p-2 sm:p-3 max-w-md mx-auto box-border overflow-hidden">

  <!-- Header -->
  <header class="w-full shrink-0 flex items-center justify-between bg-amber-950/80 border border-amber-500/30 px-3 py-1.5 sm:px-4 sm:py-2 rounded-2xl shadow-xl backdrop-blur-md">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🇬🇭</span>
      <div>
        <h1 class="cinzel font-black text-xs sm:text-sm text-amber-300 tracking-wider leading-none">
          CHASKELE GHANA
        </h1>
        <span class="text-[9.5px] text-amber-400 font-bold uppercase tracking-widest">Street Can Cricket</span>
      </div>
    </div>

    <!-- Stats -->
    <div class="flex items-center gap-3">
      <div class="text-right">
        <span class="text-[9px] text-gray-400 uppercase font-bold block">Runs</span>
        <span id="runsDisplay" class="orbitron text-xs sm:text-sm font-black text-amber-300">0</span>
      </div>
      <div class="text-right">
        <span class="text-[9px] text-gray-400 uppercase font-bold block">Wickets</span>
        <span id="wicketsDisplay" class="orbitron text-xs sm:text-sm font-black text-red-400">0/3</span>
      </div>
    </div>
  </header>

  <!-- Pitch Canvas -->
  <main class="flex-1 w-full my-1 relative flex items-center justify-center overflow-hidden">
    <canvas id="chaskeleCanvas" class="w-full h-full rounded-2xl border-2 border-amber-600/40 shadow-2xl"></canvas>
  </main>

  <!-- Big Hit Button -->
  <footer class="w-full shrink-0 py-1.5 px-3 rounded-xl bg-amber-950/90 border border-white/10 text-[10px] sm:text-xs text-amber-200/80 flex items-center justify-between gap-2">
    <span id="hitComment" class="font-bold text-amber-300 text-xs">Wait for pitch...</span>
    <button onclick="swingBat()" id="swingBtn" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-300 text-black font-black text-sm uppercase tracking-wider shadow-lg active:scale-95 flex items-center gap-1.5">
      <span>SWING STICK! 🏏</span>
    </button>
  </footer>

  <!-- End Game Modal -->
  <div id="endModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-gradient-to-b from-amber-950 to-stone-950 border-2 border-amber-400 p-6 rounded-3xl max-w-sm w-full text-center shadow-2xl space-y-4">
      <div id="endEmoji" class="text-5xl">🏆</div>
      <h2 id="endTitle" class="cinzel text-xl font-black text-amber-300">INNINGS OVER!</h2>
      <p id="endDesc" class="text-xs text-amber-100 font-medium leading-relaxed">
        Great batting in the street chaskele match!
      </p>
      <div class="py-2 px-4 rounded-xl bg-black/50 border border-amber-500/40 flex justify-around text-xs font-bold">
        <div>Total Runs: <span id="finalRuns" class="text-amber-400 font-black text-base">0</span></div>
      </div>
      <button onclick="resetGame()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-yellow-500 text-black font-black text-xs tracking-wider uppercase shadow-lg active:scale-95 transition-all">
        Next Over
      </button>
    </div>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playSfx(type) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const t = audioCtx.currentTime;

        if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(400, t);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
          osc.start(t);
          osc.stop(t + 0.12);
        } else if (type === 'cheer') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, t);
          osc.frequency.linearRampToValueAtTime(1040, t + 0.3);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
          osc.start(t);
          osc.stop(t + 0.4);
        } else if (type === 'out') {
          osc.frequency.setValueAtTime(160, t);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
          osc.start(t);
          osc.stop(t + 0.2);
        }
      } catch (e) {}
    }

    const canvas = document.getElementById('chaskeleCanvas');
    const ctx = canvas.getContext('2d');

    let W = 360;
    let H = 540;
    let runs = 0;
    let wickets = 0;

    // Tin Can Ball
    let can = {
      x: 180,
      y: 80,
      vy: 0,
      radius: 16,
      scale: 0.6,
      inPitch: false,
      hit: false
    };

    // Strike Zone
    let strikeZone = { y1: 360, y2: 440 };

    // Bat Angle
    let batSwinging = false;
    let batAngle = 0;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      W = canvas.width = rect.width * window.devicePixelRatio;
      H = canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      W = rect.width;
      H = rect.height;

      strikeZone = { y1: H * 0.68, y2: H * 0.82 };
      pitchCan();
    }

    function pitchCan() {
      can.x = W / 2 + (Math.random() - 0.5) * 30;
      can.y = H * 0.15;
      can.vy = 4 + Math.random() * 2.5;
      can.scale = 0.6;
      can.inPitch = true;
      can.hit = false;
      document.getElementById('hitComment').textContent = "Can is coming! Time your swing!";
    }

    function swingBat() {
      if (batSwinging || wickets >= 3) return;
      batSwinging = true;

      // Check if can is in the strike zone!
      if (can.inPitch && !can.hit && can.y >= strikeZone.y1 && can.y <= strikeZone.y2) {
        // HIT!
        can.hit = true;
        can.vy = -12;
        playSfx('hit');

        const perfect = Math.abs(can.y - (strikeZone.y1 + strikeZone.y2) / 2) < 20;
        if (perfect) {
          runs += 6;
          playSfx('cheer');
          document.getElementById('hitComment').innerHTML = "<span class='text-amber-300 font-black'>MAXIMUM SIXER! 🚀 +6 RUNS!</span>";
        } else {
          runs += 4;
          playSfx('cheer');
          document.getElementById('hitComment').innerHTML = "<span class='text-emerald-400 font-black'>FOUR! BOUNDARY CRACK! 💥 +4 RUNS!</span>";
        }
        document.getElementById('runsDisplay').textContent = runs;
        setTimeout(pitchCan, 1200);
      } else {
        // Miss!
        document.getElementById('hitComment').textContent = "SWING & MISS!";
      }

      setTimeout(() => { batSwinging = false; }, 300);
    }

    // Touch on canvas also swings
    canvas.addEventListener('pointerdown', swingBat);

    function update() {
      if (can.inPitch) {
        can.y += can.vy;
        can.scale = can.hit ? Math.max(0.4, can.scale - 0.02) : Math.min(1.2, can.scale + 0.015);

        // Can passed without hit = Wicket!
        if (!can.hit && can.y > strikeZone.y2 + 30) {
          can.inPitch = false;
          wickets++;
          playSfx('out');
          document.getElementById('wicketsDisplay').textContent = `${wickets}/3`;
          document.getElementById('hitComment').innerHTML = "<span class='text-red-400 font-black'>BOWLED OUT! 💥 WICKET!</span>";

          if (wickets >= 3) {
            setTimeout(endGame, 800);
          } else {
            setTimeout(pitchCan, 1200);
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Draw Dirt Pitch Lines
      ctx.save();
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(W * 0.25, H * 0.1); ctx.lineTo(W * 0.15, H);
      ctx.moveTo(W * 0.75, H * 0.1); ctx.lineTo(W * 0.85, H);
      ctx.stroke();

      // Draw Green Strike Zone Box
      ctx.fillStyle = 'rgba(34, 197, 94, 0.15)';
      ctx.fillRect(W * 0.2, strikeZone.y1, W * 0.6, strikeZone.y2 - strikeZone.y1);
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.strokeRect(W * 0.2, strikeZone.y1, W * 0.6, strikeZone.y2 - strikeZone.y1);
      ctx.restore();

      // Draw Crushed Tin Can
      if (can.inPitch) {
        ctx.save();
        ctx.translate(can.x, can.y);
        ctx.scale(can.scale, can.scale);
        ctx.beginPath();
        ctx.roundRect(-can.radius, -can.radius * 0.7, can.radius * 2, can.radius * 1.4, 4);
        ctx.fillStyle = '#cbd5e1';
        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = can.hit ? 16 : 4;
        ctx.fill();
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(-can.radius + 4, -can.radius * 0.7 + 2, can.radius * 2 - 8, 4);
        ctx.restore();
      }

      // Draw Wooden Bat / Plank
      ctx.save();
      const batY = (strikeZone.y1 + strikeZone.y2) / 2;
      ctx.translate(W * 0.65, batY);
      ctx.rotate(batSwinging ? -0.8 : 0.4);
      ctx.fillStyle = '#78350f';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 8;
      ctx.fillRect(-8, -45, 16, 90);
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 2;
      ctx.strokeRect(-8, -45, 16, 90);
      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function endGame() {
      document.getElementById('finalRuns').textContent = runs;
      document.getElementById('endModal').classList.remove('hidden');
    }

    function resetGame() {
      runs = 0;
      wickets = 0;
      document.getElementById('runsDisplay').textContent = 0;
      document.getElementById('wicketsDisplay').textContent = "0/3";
      document.getElementById('endModal').classList.add('hidden');
      pitchCan();
    }

    window.addEventListener('resize', resize);
    resize();
    loop();
  </script>
</body>
</html>
