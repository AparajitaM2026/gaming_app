<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Tic-Tac-Toe — You vs Unbeatable AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #111424 0%, #07080e 100%);
      font-family: 'Inter', sans-serif;
      color: #fff;
      user-select: none;
    }
    .orbitron { font-family: 'Orbitron', sans-serif; }
    
    .cell-glow:hover {
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
      border-color: #00F0FF;
    }
  </style>
</head>
<body class="h-full w-full flex flex-col items-center justify-between p-2 sm:p-3 max-w-md mx-auto box-border overflow-hidden">

  <!-- Header -->
  <div class="w-full shrink-0 flex items-center justify-between bg-slate-900/90 border border-slate-700/60 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl">
    <div class="flex items-center gap-2">
      <span class="text-neonCyan font-black text-lg">✕</span>
      <span class="text-xs font-bold text-cyan-300">YOU (X)</span>
    </div>
    <span class="orbitron font-extrabold text-xs text-amber-300" id="statusText">YOUR TURN</span>
    <div class="flex items-center gap-2">
      <span class="text-xs font-bold text-purple-300">AI BOT (O)</span>
      <span class="text-purple-400 font-black text-lg">◯</span>
    </div>
  </div>

  <!-- Score Board -->
  <div class="w-full shrink-0 grid grid-cols-3 gap-2 my-1 text-center">
    <div class="p-1.5 sm:p-2 rounded-xl bg-cyan-950/40 border border-cyan-500/30">
      <span class="text-[9.5px] text-gray-400 block">YOU WON</span>
      <span class="orbitron font-extrabold text-base sm:text-lg text-cyan-300" id="playerWins">0</span>
    </div>
    <div class="p-1.5 sm:p-2 rounded-xl bg-slate-900/40 border border-slate-700/40">
      <span class="text-[9.5px] text-gray-400 block">DRAWS</span>
      <span class="orbitron font-extrabold text-base sm:text-lg text-gray-300" id="draws">0</span>
    </div>
    <div class="p-1.5 sm:p-2 rounded-xl bg-purple-950/40 border border-purple-500/30">
      <span class="text-[9.5px] text-gray-400 block">AI WON</span>
      <span class="orbitron font-extrabold text-base sm:text-lg text-purple-300" id="aiWins">0</span>
    </div>
  </div>

  <!-- 3x3 Grid (Responsive Fit) -->
  <div class="flex-1 min-h-0 w-full flex items-center justify-center py-1 overflow-hidden">
    <div class="h-full aspect-square max-w-[340px] grid grid-cols-3 gap-2 p-2 sm:p-2.5 rounded-2xl bg-slate-900/90 border-2 border-slate-700/80 shadow-2xl">
      <button onclick="makeMove(0)" class="cell-glow rounded-xl bg-slate-800/80 border border-slate-700 text-3xl sm:text-4xl font-black orbitron flex items-center justify-center transition-all h-full" id="cell-0"></button>
      <button onclick="makeMove(1)" class="cell-glow rounded-xl bg-slate-800/80 border border-slate-700 text-3xl sm:text-4xl font-black orbitron flex items-center justify-center transition-all h-full" id="cell-1"></button>
      <button onclick="makeMove(2)" class="cell-glow rounded-xl bg-slate-800/80 border border-slate-700 text-3xl sm:text-4xl font-black orbitron flex items-center justify-center transition-all h-full" id="cell-2"></button>
      <button onclick="makeMove(3)" class="cell-glow rounded-xl bg-slate-800/80 border border-slate-700 text-3xl sm:text-4xl font-black orbitron flex items-center justify-center transition-all h-full" id="cell-3"></button>
      <button onclick="makeMove(4)" class="cell-glow rounded-xl bg-slate-800/80 border border-slate-700 text-3xl sm:text-4xl font-black orbitron flex items-center justify-center transition-all h-full" id="cell-4"></button>
      <button onclick="makeMove(5)" class="cell-glow rounded-xl bg-slate-800/80 border border-slate-700 text-3xl sm:text-4xl font-black orbitron flex items-center justify-center transition-all h-full" id="cell-5"></button>
      <button onclick="makeMove(6)" class="cell-glow rounded-xl bg-slate-800/80 border border-slate-700 text-3xl sm:text-4xl font-black orbitron flex items-center justify-center transition-all h-full" id="cell-6"></button>
      <button onclick="makeMove(7)" class="cell-glow rounded-xl bg-slate-800/80 border border-slate-700 text-3xl sm:text-4xl font-black orbitron flex items-center justify-center transition-all h-full" id="cell-7"></button>
      <button onclick="makeMove(8)" class="cell-glow rounded-xl bg-slate-800/80 border border-slate-700 text-3xl sm:text-4xl font-black orbitron flex items-center justify-center transition-all h-full" id="cell-8"></button>
    </div>
  </div>

  <!-- Controls -->
  <div class="w-full shrink-0 flex gap-2 sm:gap-3 pt-1">
    <button onclick="resetBoard()" class="flex-1 py-2 sm:py-2.5 rounded-xl bg-cyan-500 text-black font-extrabold orbitron text-xs uppercase hover:opacity-90 active:scale-95 transition-all">
      Reset Round
    </button>
    <button onclick="window.parent.closeGameTheater()" class="flex-1 py-2 sm:py-2.5 rounded-xl bg-white/10 border border-white/20 text-white font-bold text-xs hover:bg-white/20 active:scale-95 transition-all">
      Exit to Games
    </button>
  </div>

  <!-- VICTORY MODAL -->
  <div id="tictacModal" class="hidden absolute inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md rounded-2xl">
    <div class="w-full max-w-xs bg-slate-900 border border-cyan-500/50 rounded-2xl p-5 text-center shadow-2xl space-y-4">
      <div id="ttIcon" class="w-16 h-16 mx-auto rounded-full bg-cyan-500/20 border-2 border-cyan-400 flex items-center justify-center text-cyan-400 text-3xl shadow-lg shadow-cyan-500/30">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <div>
        <h3 id="ttTitle" class="text-xl font-black orbitron text-white">YOU WON!</h3>
        <p id="ttDesc" class="text-xs text-gray-300 mt-1">Great moves! 3 in a row!</p>
      </div>
      <div class="space-y-2 pt-1">
        <button onclick="resetBoard()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-600 text-black font-extrabold orbitron text-xs uppercase shadow-lg shadow-cyan-500/30 hover:opacity-90 active:scale-95 transition-all">
          <i class="fa-solid fa-rotate-right mr-1"></i> Play Next Round
        </button>
        <button onclick="window.parent.closeGameTheater()" class="w-full py-2.5 rounded-xl bg-slate-800 border border-white/10 text-white font-bold text-xs hover:bg-slate-700 active:scale-95 transition-all">
          <i class="fa-solid fa-arrow-left mr-1"></i> Exit to Games
        </button>
      </div>
    </div>
  </div>

  <script>
    let board = Array(9).fill(null);
    let isHumanTurn = true;
    let gameOver = false;
    let pWins = 0, aWins = 0, drawCount = 0;

    const WIN_PATTERNS = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    function makeMove(idx) {
      if (!isHumanTurn || board[idx] || gameOver) return;

      board[idx] = 'X';
      renderCell(idx, 'X', 'text-cyan-400');

      if (checkWin('X')) {
        pWins++;
        document.getElementById('playerWins').textContent = pWins;
        endRound('player');
        return;
      }

      if (board.every(c => c !== null)) {
        drawCount++;
        document.getElementById('draws').textContent = drawCount;
        endRound('draw');
        return;
      }

      isHumanTurn = false;
      document.getElementById('statusText').textContent = "AI IS THINKING...";

      setTimeout(aiMove, 600);
    }

    function aiMove() {
      if (gameOver) return;

      // Minimax or smart block logic
      let bestMove = findWinningMove('O') || findWinningMove('X') || (board[4] === null ? 4 : null);

      if (bestMove === null) {
        const available = board.map((c, i) => c === null ? i : null).filter(c => c !== null);
        bestMove = available[Math.floor(Math.random() * available.length)];
      }

      board[bestMove] = 'O';
      renderCell(bestMove, 'O', 'text-purple-400');

      if (checkWin('O')) {
        aWins++;
        document.getElementById('aiWins').textContent = aWins;
        endRound('ai');
        return;
      }

      if (board.every(c => c !== null)) {
        drawCount++;
        document.getElementById('draws').textContent = drawCount;
        endRound('draw');
        return;
      }

      isHumanTurn = true;
      document.getElementById('statusText').textContent = "YOUR TURN (X)";
    }

    function findWinningMove(player) {
      for (const [a, b, c] of WIN_PATTERNS) {
        if (board[a] === player && board[b] === player && board[c] === null) return c;
        if (board[a] === player && board[c] === player && board[b] === null) return b;
        if (board[b] === player && board[c] === player && board[a] === null) return a;
      }
      return null;
    }

    function checkWin(player) {
      return WIN_PATTERNS.some(([a, b, c]) => board[a] === player && board[b] === player && board[c] === player);
    }

    function renderCell(idx, val, colorClass) {
      const el = document.getElementById(`cell-${idx}`);
      el.textContent = val;
      el.className = `cell-glow rounded-xl bg-slate-800/80 border border-slate-700 text-5xl font-black orbitron flex items-center justify-center transition-all h-full ${colorClass}`;
    }

    function endRound(outcome) {
      gameOver = true;
      const status = document.getElementById('statusText');
      const modal = document.getElementById('tictacModal');
      const title = document.getElementById('ttTitle');
      const desc = document.getElementById('ttDesc');
      const icon = document.getElementById('ttIcon');

      if (outcome === 'player') {
        status.textContent = "YOU WON!";
        status.className = "orbitron font-extrabold text-xs text-cyan-400";
        title.textContent = "YOU WON!";
        title.className = "text-xl font-black orbitron text-cyan-400";
        desc.textContent = "Great moves! 3 in a row!";
        icon.innerHTML = '<i class="fa-solid fa-trophy text-cyan-400 text-3xl animate-bounce"></i>';
      } else if (outcome === 'ai') {
        status.textContent = "AI BOT WON!";
        status.className = "orbitron font-extrabold text-xs text-purple-400";
        title.textContent = "AI BOT WON!";
        title.className = "text-xl font-black orbitron text-purple-400";
        desc.textContent = "The Unbeatable Bot caught the winning line.";
        icon.innerHTML = '<i class="fa-solid fa-robot text-purple-400 text-3xl"></i>';
      } else {
        status.textContent = "IT'S A DRAW!";
        status.className = "orbitron font-extrabold text-xs text-gray-400";
        title.textContent = "ROUND DRAW!";
        title.className = "text-xl font-black orbitron text-amber-400";
        desc.textContent = "Cat's game! Both played well.";
        icon.innerHTML = '<i class="fa-solid fa-handshake text-amber-400 text-3xl"></i>';
      }

      setTimeout(() => {
        modal.classList.remove('hidden');
      }, 400);
    }

    function resetBoard() {
      board = Array(9).fill(null);
      gameOver = false;
      isHumanTurn = true;
      document.getElementById('tictacModal').classList.add('hidden');
      document.getElementById('statusText').textContent = "YOUR TURN (X)";
      document.getElementById('statusText').className = "orbitron font-extrabold text-xs text-amber-300";
      for (let i = 0; i < 9; i++) {
        const el = document.getElementById(`cell-${i}`);
        el.textContent = '';
      }
    }
  </script>
</body>
</html>
