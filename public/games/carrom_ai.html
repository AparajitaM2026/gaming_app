<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voltixz Carrom Clash — Multiplayer & AI Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background: #0E101D;
      font-family: 'Inter', sans-serif;
      color: #fff;
      user-select: none;
      touch-action: manipulation;
    }
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0B0E1B;
    }
    .orbitron { font-family: 'Orbitron', sans-serif; }
    canvas {
      touch-action: none;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 4px rgba(0, 240, 255, 0.4); }
      100% { box-shadow: 0 0 16px rgba(0, 240, 255, 0.9); }
    }
    .active-turn-ring {
      animation: pulseGlow 1.2s infinite alternate ease-in-out;
    }
  </style>
</head>
<body class="h-full w-full flex flex-col items-center justify-between p-2 sm:p-3 relative box-border overflow-hidden">

  <!-- Top Realtime Match Header -->
  <div class="w-full max-w-lg shrink-0 flex items-center justify-between bg-slate-900 border border-slate-700/60 px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl shadow-lg gap-2">
    <!-- Player 1 (White) -->
    <div id="p1Card" class="flex items-center gap-2 min-w-0 transition-all rounded-lg p-1">
      <div class="w-3.5 h-3.5 rounded-full bg-white border border-slate-400 shadow shrink-0"></div>
      <div class="flex flex-col min-w-0">
        <span class="text-xs font-bold text-white leading-none truncate" id="p1NameLabel">Player 1 (White)</span>
        <span class="text-[9.5px] text-gray-400 font-semibold" id="playerScoreText">0 Pkts</span>
      </div>
    </div>

    <!-- Center Turn / Status Banner -->
    <span class="orbitron font-extrabold text-[10px] sm:text-xs text-amber-300 tracking-wide text-center truncate px-1" id="statusBanner">YOUR TURN — AIM & SHOOT</span>

    <!-- Player 2 (Black) -->
    <div id="p2Card" class="flex items-center gap-2 text-right min-w-0 transition-all rounded-lg p-1">
      <div class="flex flex-col min-w-0">
        <span class="text-xs font-bold text-amber-400 leading-none truncate" id="p2NameLabel">Player 2 (Black)</span>
        <span class="text-[9.5px] text-gray-400 font-semibold" id="aiScoreText">0 Pkts</span>
      </div>
      <div class="w-3.5 h-3.5 rounded-full bg-slate-950 border border-amber-500 shadow shrink-0"></div>
    </div>
  </div>

  <!-- Carrom Board Canvas Container (Responsive Square Fit) -->
  <div id="boardWrap" class="flex-1 min-h-0 w-full flex items-center justify-center p-1 sm:p-2 overflow-hidden">
    <div id="boardFrame" class="p-1.5 bg-amber-950 rounded-2xl shadow-2xl border-2 sm:border-4 border-amber-900 flex items-center justify-center overflow-hidden relative" style="aspect-ratio: 1 / 1; width: 440px; height: 440px; max-width: 100%; max-height: 100%;">
      <canvas id="carromCanvas" class="w-full h-full rounded-xl bg-amber-100" style="display: block; width: 100%; height: 100%; touch-action: none; user-select: none;"></canvas>

      <!-- GAME OVER / VICTORY MODAL OVERLAY -->
      <div id="gameOverModal" class="hidden absolute inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md rounded-xl">
        <div class="w-full max-w-xs bg-slate-900 border border-amber-500/50 rounded-2xl p-5 text-center shadow-2xl space-y-4">
          <div id="winnerIcon" class="w-16 h-16 mx-auto rounded-full bg-amber-500/20 border-2 border-amber-400 flex items-center justify-center text-amber-400 text-3xl shadow-lg shadow-amber-500/30">
            <i class="fa-solid fa-trophy"></i>
          </div>
          <div>
            <h3 id="winnerText" class="text-xl font-black orbitron text-white">YOU WON!</h3>
            <p id="winnerSubtext" class="text-xs text-gray-300 mt-1">All designated coins were pocketed!</p>
          </div>
          <div class="p-3 bg-slate-950 rounded-xl border border-white/10 flex justify-around text-xs">
            <div>
              <span id="p1EndName" class="text-gray-400 block text-[10px] truncate max-w-[90px]">Player 1</span>
              <span id="finalPScore" class="font-bold text-white text-base">0 Pkts</span>
            </div>
            <div class="border-r border-white/10"></div>
            <div>
              <span id="p2EndName" class="text-gray-400 block text-[10px] truncate max-w-[90px]">Player 2</span>
              <span id="finalAScore" class="font-bold text-amber-400 text-base">0 Pkts</span>
            </div>
          </div>
          <div class="space-y-2 pt-1">
            <button onclick="requestResetCarrom()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 text-black font-extrabold orbitron text-xs uppercase shadow-lg shadow-amber-500/30 hover:opacity-90 active:scale-95 transition-all">
              <i class="fa-solid fa-rotate-right mr-1"></i> Play Again
            </button>
            <button onclick="window.parent?.closeGameTheater?.()" class="w-full py-2.5 rounded-xl bg-slate-800 border border-white/10 text-white font-bold text-xs hover:bg-slate-700 active:scale-95 transition-all">
              <i class="fa-solid fa-arrow-left mr-1"></i> Exit to Games
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Deck: Striker Position Guide & Action Controls -->
  <div class="w-full max-w-lg shrink-0 flex flex-col gap-1.5 pt-1">
    <div class="flex items-center justify-between text-[11px] text-gray-400 px-1">
      <span id="modeBadge" class="font-bold text-emerald-400">Live 2-Player</span>
      <span class="text-[10px] text-gray-400">Drag striker to aim &bull; Release to shoot</span>
    </div>
    <div class="flex gap-2 sm:gap-3">
      <button id="flipViewBtn" onclick="toggleFlipBoard()" class="px-3 py-2 sm:py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-white/20 text-white font-bold text-xs shadow transition-all active:scale-95 flex items-center justify-center gap-1.5" title="Flip Board Perspective">
        <i class="fa-solid fa-arrows-rotate"></i> <span>Flip View</span>
      </button>
      <button onclick="requestResetCarrom()" class="flex-1 py-2 sm:py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-extrabold orbitron text-xs uppercase shadow-lg transition-all active:scale-95">
        Reset Board
      </button>
      <button onclick="window.parent?.closeGameTheater?.()" class="flex-1 py-2 sm:py-2.5 rounded-xl bg-white/10 border border-white/20 text-white font-bold text-xs hover:bg-white/20 active:scale-95 transition-all">
        Exit to Games
      </button>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // URL PARAMETERS & MULTIPLAYER SETUP
    // -------------------------------------------------------------
    const urlParams = new URLSearchParams(window.location.search);
    const gameMode = urlParams.get('mode') || 'ai'; // 'party', 'passplay', or 'ai'
    const isPartyMode = (gameMode === 'party');
    const isPassPlay = (gameMode === 'passplay');
    const myUserId = String(urlParams.get('myId') || '');
    const myUsername = String(urlParams.get('myUsername') || '');
    const myPlayerIndexParam = urlParams.get('myPlayerIndex');
    const myPlayerIndex = (myPlayerIndexParam !== null && myPlayerIndexParam !== '') ? parseInt(myPlayerIndexParam, 10) : -1;
    const isHostParam = (urlParams.get('isHost') === 'true');
    const roomCode = urlParams.get('room') || '';


    // Resolve Active Players
    let activePlayers = [];
    if (isPartyMode) {
      let passedPlayers = [];
      try {
        passedPlayers = JSON.parse(decodeURIComponent(urlParams.get('players') || '[]'));
      } catch (e) {
        try { passedPlayers = JSON.parse(urlParams.get('players') || '[]'); } catch (err) {}
      }
      if (!passedPlayers || passedPlayers.length === 0) {
        if (window.parent?.activePartySession?.players) {
          passedPlayers = window.parent.activePartySession.players;
        }
      }

      // Guarantee strict binary exclusivity between Host (White) and Friend (Black)
      let amIHost = false;
      if (myPlayerIndex === 0) {
        amIHost = true;
      } else if (myPlayerIndex === 1) {
        amIHost = false;
      } else if (isHostParam) {
        amIHost = true;
      } else {
        amIHost = false;
      }

      let hostName = 'Host';
      let friendName = 'Friend';
      if (Array.isArray(passedPlayers) && passedPlayers.length > 0) {
        if (passedPlayers[0] && passedPlayers[0].username) hostName = passedPlayers[0].username;
        if (passedPlayers[1] && passedPlayers[1].username) friendName = passedPlayers[1].username;
      }
      if (!amIHost && myUsername) {
        friendName = myUsername;
      } else if (amIHost && myUsername) {
        hostName = myUsername;
      }

      activePlayers = [
        { id: 'p1', username: hostName, color: 'WHITE', isBot: false, isMe: amIHost },
        { id: 'p2', username: friendName, color: 'BLACK', isBot: false, isMe: !amIHost }
      ];
    } else if (isPassPlay) {
      activePlayers = [
        { id: 'p1', username: 'Player 1', color: 'WHITE', isBot: false, isMe: true },
        { id: 'p2', username: 'Player 2', color: 'BLACK', isBot: false, isMe: true }
      ];
    } else {
      activePlayers = [
        { id: 'p1', username: 'You', color: 'WHITE', isBot: false, isMe: true },
        { id: 'bot', username: 'AI Bot', color: 'BLACK', isBot: true, isMe: false }
      ];
    }

    const p1 = activePlayers[0] || { username: 'Player 1', color: 'WHITE', isMe: true };
    const p2 = activePlayers[1] || { username: (isPartyMode ? 'Friend' : 'AI Bot'), color: 'BLACK', isMe: false };
    const isHost = Boolean(p1.isMe);

    // Auto-flip perspective for Player 2 in Party Mode so they always play from the bottom!
    let isFlipped = Boolean(isPartyMode && p2.isMe);

    function toggleFlipBoard() {
      isFlipped = !isFlipped;
      const btn = document.getElementById('flipViewBtn');
      if (btn) {
        if (isFlipped) {
          btn.classList.add('border-cyan-400', 'text-cyan-300', 'bg-cyan-950/40');
        } else {
          btn.classList.remove('border-cyan-400', 'text-cyan-300', 'bg-cyan-950/40');
        }
      }
      render();
    }

    const flipBtn = document.getElementById('flipViewBtn');
    if (flipBtn && isFlipped) {
      flipBtn.classList.add('border-cyan-400', 'text-cyan-300', 'bg-cyan-950/40');
    }

    // Update Mode badge with player role
    const modeBadge = document.getElementById('modeBadge');
    if (modeBadge) {
      if (isPartyMode) {
        modeBadge.textContent = isHost ? 'Party Live • White (Host)' : 'Party Live • Black (Friend)';
      } else if (isPassPlay) {
        modeBadge.textContent = 'Pass & Play (2P)';
      } else {
        modeBadge.textContent = 'Vs Smart AI';
      }
    }

    // Update Header labels
    const p1Label = document.getElementById('p1NameLabel');
    const p2Label = document.getElementById('p2NameLabel');
    if (p1Label) {
      p1Label.innerHTML = `${p1.username} <span class="text-[9px] text-gray-300">(WHITE)</span>${(isPartyMode && p1.isMe) ? ' <span class="text-cyan-300 text-[9px] font-bold">(You)</span>' : ''}`;
    }
    if (p2Label) {
      const isBotLabel = (!isPartyMode && !isPassPlay);
      p2Label.innerHTML = `${p2.username} <span class="text-[9px] text-amber-400">(${isBotLabel ? 'BOT' : 'BLACK'})</span>${(isPartyMode && p2.isMe) ? ' <span class="text-cyan-300 text-[9px] font-bold">(You)</span>' : ''}`;
    }

    const p1End = document.getElementById('p1EndName');
    const p2End = document.getElementById('p2EndName');
    if (p1End) p1End.textContent = p1.username;
    if (p2End) p2End.textContent = p2.username;

    // -------------------------------------------------------------
    // CANVAS & PHYSICS SETUP
    // -------------------------------------------------------------
    const canvas = document.getElementById('carromCanvas');
    const ctx = canvas.getContext('2d');
    const SIZE = 500;
    canvas.width = SIZE;
    canvas.height = SIZE;

    function resizeBoard() {
      const wrap = document.getElementById('boardWrap');
      const frame = document.getElementById('boardFrame');
      if (!wrap || !frame) return;
      const pad = 12;
      const availW = Math.max(100, wrap.clientWidth - pad);
      const availH = Math.max(100, wrap.clientHeight - pad);
      const side = Math.floor(Math.min(availW, availH));
      frame.style.width = side + 'px';
      frame.style.height = side + 'px';
    }
    window.addEventListener('resize', resizeBoard);
    window.addEventListener('orientationchange', resizeBoard);
    document.addEventListener('DOMContentLoaded', resizeBoard);
    setTimeout(resizeBoard, 20);
    setTimeout(resizeBoard, 150);

    const FRICTION = 0.985;
    const POCKET_RADIUS = 28;
    const pockets = [
      { x: 35, y: 35 },
      { x: SIZE - 35, y: 35 },
      { x: 35, y: SIZE - 35 },
      { x: SIZE - 35, y: SIZE - 35 }
    ];

    const BASE_Y_WHITE = SIZE - 80;
    const BASE_Y_BLACK = 80;

    let pScore = 0, aScore = 0;
    let isWhiteTurn = true; // true = White / Player 1; false = Black / Player 2
    let isAiming = false;
    let isPlacing = false;
    let aimStart = null;
    let aimCurrent = null;
    let moving = false;
    let gameOver = false;
    let aiTimer = null;
    let pocketedWhiteThisTurn = 0;
    let pocketedBlackThisTurn = 0;

    // Striker Object
    let striker = {
      x: SIZE / 2,
      y: BASE_Y_WHITE,
      radius: 18,
      vx: 0,
      vy: 0,
      color: '#DC2626'
    };

    // Coins Array
    let coins = [];

    function setupCoins() {
      coins = [];
      const cx = SIZE / 2, cy = SIZE / 2;
      const r = 12;

      // Queen in Center
      coins.push({ x: cx, y: cy, radius: r, vx: 0, vy: 0, type: 'queen', color: '#EF4444' });

      // Ring of 6 Coins (3 White, 3 Black)
      for (let i = 0; i < 6; i++) {
        const angle = (i * Math.PI) / 3;
        const type = (i % 2 === 0) ? 'white' : 'black';
        coins.push({
          x: cx + Math.cos(angle) * (r * 2.2),
          y: cy + Math.sin(angle) * (r * 2.2),
          radius: r,
          vx: 0,
          vy: 0,
          type,
          color: (type === 'white') ? '#FFFFFF' : '#1E293B'
        });
      }
    }

    function getSafeStrikerX(desiredX, targetY) {
      let x = Math.max(90, Math.min(SIZE - 90, desiredX));
      for (const c of coins) {
        const minDist = striker.radius + c.radius + 3;
        const dy = targetY - c.y;
        if (Math.abs(dy) < minDist) {
          const dx = x - c.x;
          const dist = Math.hypot(dx, dy);
          if (dist < minDist) {
            const sign = dx >= 0 ? 1 : -1;
            const requiredDx = Math.sqrt(Math.max(0, minDist * minDist - dy * dy)) + 3;
            let testX = c.x + sign * requiredDx;
            if (testX >= 90 && testX <= SIZE - 90) {
              x = testX;
            } else {
              testX = c.x - sign * requiredDx;
              if (testX >= 90 && testX <= SIZE - 90) x = testX;
            }
          }
        }
      }
      return x;
    }

    function resetStrikerForTurn() {
      const targetBaseY = isWhiteTurn ? BASE_Y_WHITE : BASE_Y_BLACK;
      striker.x = getSafeStrikerX(SIZE / 2, targetBaseY);
      striker.y = targetBaseY;
      striker.vx = 0;
      striker.vy = 0;
      striker.color = isWhiteTurn ? '#DC2626' : '#1E293B';
      pocketedWhiteThisTurn = 0;
      pocketedBlackThisTurn = 0;
      strikerFoul = false;
    }

    function isMyTurnNow() {
      if (gameOver || moving) return false;
      if (!isPartyMode && !isPassPlay) {
        return isWhiteTurn; // Local user is White in AI mode
      }
      if (isPassPlay) {
        return true; // Local 2 players can both shoot on their turn
      }
      if (isPartyMode) {
        return isWhiteTurn ? Boolean(p1.isMe) : Boolean(p2.isMe);
      }
      return false;
    }

    function updateStatusBanner() {
      const banner = document.getElementById('statusBanner');
      const p1Card = document.getElementById('p1Card');
      const p2Card = document.getElementById('p2Card');

      if (!banner) return;

      if (gameOver) return;

      if (isWhiteTurn) {
        if (p1Card) p1Card.classList.add('bg-white/10', 'ring-1', 'ring-white/40');
        if (p2Card) p2Card.classList.remove('bg-white/10', 'ring-1', 'ring-white/40');
      } else {
        if (p2Card) p2Card.classList.add('bg-white/10', 'ring-1', 'ring-amber-400/40');
        if (p1Card) p1Card.classList.remove('bg-white/10', 'ring-1', 'ring-white/40');
      }

      if (moving) {
        banner.textContent = "STRIKE IN MOTION...";
        banner.className = "orbitron font-extrabold text-[10px] sm:text-xs text-amber-300 tracking-wide text-center truncate px-1";
        return;
      }

      if (isPartyMode) {
        if (isWhiteTurn) {
          if (p1.isMe) {
            banner.textContent = "YOUR TURN (WHITE) — AIM & SHOOT";
            banner.className = "orbitron font-extrabold text-[10px] sm:text-xs text-cyan-300 tracking-wide text-center truncate px-1";
          } else {
            banner.textContent = `WAITING FOR ${p1.username.toUpperCase()} TO SHOOT...`;
            banner.className = "orbitron font-extrabold text-[10px] sm:text-xs text-gray-400 tracking-wide text-center truncate px-1";
          }
        } else {
          if (p2.isMe) {
            banner.textContent = "YOUR TURN (BLACK) — AIM & SHOOT";
            banner.className = "orbitron font-extrabold text-[10px] sm:text-xs text-amber-300 tracking-wide text-center truncate px-1";
          } else {
            banner.textContent = `WAITING FOR ${p2.username.toUpperCase()} TO SHOOT...`;
            banner.className = "orbitron font-extrabold text-[10px] sm:text-xs text-gray-400 tracking-wide text-center truncate px-1";
          }
        }
      } else if (isPassPlay) {
        banner.textContent = isWhiteTurn ? `${p1.username.toUpperCase()} (WHITE) — SHOOT` : `${p2.username.toUpperCase()} (BLACK) — SHOOT`;
        banner.className = "orbitron font-extrabold text-[10px] sm:text-xs text-amber-300 tracking-wide text-center truncate px-1";
      } else {
        // AI Mode
        if (isWhiteTurn) {
          banner.textContent = "YOUR TURN — AIM & SHOOT";
          banner.className = "orbitron font-extrabold text-[10px] sm:text-xs text-cyan-300 tracking-wide text-center truncate px-1";
        } else {
          banner.textContent = "AI BOT IS AIMING...";
          banner.className = "orbitron font-extrabold text-[10px] sm:text-xs text-amber-400 tracking-wide text-center truncate px-1";
        }
      }
    }

    // -------------------------------------------------------------
    // CONTROLS: POINTER DOWN, MOVE, UP
    // -------------------------------------------------------------
    let lastStrikerMoveTime = 0;
    function sendStrikerMoveThrottled(x, y, force = false) {
      if (!isPartyMode) return;
      const now = performance.now();
      if (force || now - lastStrikerMoveTime >= 50) {
        lastStrikerMoveTime = now;
        sendPartyAction({
          action: 'CARROM_STRIKER_MOVE',
          strikerX: x,
          strikerY: y
        });
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (!isMyTurnNow()) return;
      try { canvas.setPointerCapture(e.pointerId); } catch(err) {}

      const rect = canvas.getBoundingClientRect();
      const screenX = (e.clientX - rect.left) * (SIZE / rect.width);
      const screenY = (e.clientY - rect.top) * (SIZE / rect.height);

      const x = isFlipped ? (SIZE - screenX) : screenX;
      const y = isFlipped ? (SIZE - screenY) : screenY;

      const targetBaseY = isWhiteTurn ? BASE_Y_WHITE : BASE_Y_BLACK;

      // Tap near striker to aim
      if (Math.hypot(x - striker.x, y - striker.y) < striker.radius * 2.6) {
        isAiming = true;
        isPlacing = false;
        aimStart = { x: striker.x, y: striker.y };
        aimCurrent = { x, y };
      } else if (Math.abs(y - targetBaseY) < 38 && x >= 60 && x <= SIZE - 60) {
        // Tap or drag along baseline to reposition striker safely
        isPlacing = true;
        isAiming = false;
        striker.x = getSafeStrikerX(x, targetBaseY);
        render();
        sendStrikerMoveThrottled(striker.x, striker.y, true);
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (gameOver) return;
      if (!isAiming && !isPlacing) return;

      const rect = canvas.getBoundingClientRect();
      const screenX = (e.clientX - rect.left) * (SIZE / rect.width);
      const screenY = (e.clientY - rect.top) * (SIZE / rect.height);

      const x = isFlipped ? (SIZE - screenX) : screenX;
      const y = isFlipped ? (SIZE - screenY) : screenY;

      if (isAiming) {
        aimCurrent = { x, y };
      } else if (isPlacing) {
        const targetBaseY = isWhiteTurn ? BASE_Y_WHITE : BASE_Y_BLACK;
        striker.x = getSafeStrikerX(x, targetBaseY);
        render();
        sendStrikerMoveThrottled(striker.x, striker.y, false);
      }
    });

    canvas.addEventListener('pointerup', (e) => {
      try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}

      if (isPlacing) {
        isPlacing = false;
        sendStrikerMoveThrottled(striker.x, striker.y, true);
        return;
      }
      if (!isAiming || gameOver) return;
      isAiming = false;
      const dx = aimStart.x - aimCurrent.x;
      const dy = aimStart.y - aimCurrent.y;
      const dist = Math.hypot(dx, dy);

      // Require a minimum drag distance to prevent accidental tap
      if (dist < 10) return;

      const power = Math.min(18, dist * 0.18);
      const angle = Math.atan2(dy, dx);
      striker.vx = Math.cos(angle) * power;
      striker.vy = Math.sin(angle) * power;
      moving = true;
      movingStartTime = performance.now();
      updateStatusBanner();

      // Broadcast strike to party peer
      if (isPartyMode) {
        sendPartyAction({
          action: 'CARROM_STRIKE',
          strikerX: striker.x,
          strikerY: striker.y,
          vx: striker.vx,
          vy: striker.vy,
          isWhiteTurn: isWhiteTurn
        });
      }
    });

    canvas.addEventListener('pointercancel', (e) => {
      try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
      isAiming = false;
      isPlacing = false;
    });

    // -------------------------------------------------------------
    // REALTIME PARTY SYNC & MESSAGING
    // -------------------------------------------------------------
    function sendPartyAction(actionPayload) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'PARTY_ACTION',
          gameSlug: 'carrom-clash-ai',
          roomCode: roomCode || window.parent?.activePartySession?.roomCode,
          ...actionPayload
        }, '*');
      }
    }

    function handleRemotePartyAction(data) {
      if (!data) return;

      if (data.action === 'CARROM_STRIKE') {
        // Strict receiver validation: only accept strike if idle and on sender's turn
        if (moving) return;
        if (data.isWhiteTurn !== isWhiteTurn) return;

        clearTimeout(window._carromSyncTimeout);
        striker.x = data.strikerX;
        striker.y = data.strikerY;
        striker.vx = data.vx;
        striker.vy = data.vy;
        isWhiteTurn = data.isWhiteTurn;
        moving = true;
        movingStartTime = performance.now();
        updateStatusBanner();
      } else if (data.action === 'CARROM_STRIKER_MOVE') {
        if (!moving) {
          striker.x = data.strikerX;
          striker.y = data.strikerY;
          render();
        }
      } else if (data.action === 'CARROM_TURN_RESULT' || data.action === 'CARROM_SYNC_STATE' || data.action === 'CARROM_GAME_OVER') {
        clearTimeout(window._carromSyncTimeout);
        moving = false;
        movingStartTime = 0;
        if (Array.isArray(data.coins)) {
          coins = data.coins.map(c => ({
            x: c.x,
            y: c.y,
            radius: 12,
            vx: 0,
            vy: 0,
            type: c.type,
            color: c.color
          }));
        }
        if (data.pScore !== undefined) {
          pScore = data.pScore;
          const pEl = document.getElementById('playerScoreText');
          if (pEl) pEl.textContent = `${pScore} Pkts`;
        }
        if (data.aScore !== undefined) {
          aScore = data.aScore;
          const aEl = document.getElementById('aiScoreText');
          if (aEl) aEl.textContent = `${aScore} Pkts`;
        }

        if (data.isGameOver || data.action === 'CARROM_GAME_OVER') {
          triggerGameOver(data.winnerPlayerId, data.winnerReason);
        } else {
          if (data.nextTurn !== undefined) {
            isWhiteTurn = data.nextTurn;
            resetStrikerForTurn();
            updateStatusBanner();
          }
          checkGameOver();
        }
        render();
      } else if (data.action === 'CARROM_RESET') {
        clearTimeout(window._carromSyncTimeout);
        resetCarromLocal();
      }
    }

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'PARTY_GAME_UPDATE') {
        const payload = event.data.actionData || event.data;
        const sId = event.data.senderId || payload.senderId;
        if (sId && myUserId && String(sId) === String(myUserId)) {
          return;
        }
        handleRemotePartyAction(payload);
      }
    });

    function requestResetCarrom() {
      if (isPartyMode && !isHost) {
        const banner = document.getElementById('statusBanner');
        if (banner) {
          banner.textContent = "ONLY ROOM HOST CAN RESET THE BOARD";
          banner.className = "orbitron font-extrabold text-[10px] sm:text-xs text-amber-400 tracking-wide text-center truncate px-1";
          setTimeout(updateStatusBanner, 1800);
        }
        return;
      }
      resetCarromLocal();
      if (isPartyMode) {
        sendPartyAction({ action: 'CARROM_RESET' });
      }
    }

    function resetCarromLocal() {
      clearTimeout(aiTimer);
      clearTimeout(window._carromSyncTimeout);
      pScore = 0;
      aScore = 0;
      isWhiteTurn = true;
      moving = false;
      movingStartTime = 0;
      strikerFoul = false;
      gameOver = false;
      document.getElementById('gameOverModal').classList.add('hidden');
      document.getElementById('playerScoreText').textContent = '0 Pkts';
      document.getElementById('aiScoreText').textContent = '0 Pkts';
      setupCoins();
      resetStrikerForTurn();
      updateStatusBanner();
      render();
    }

    // -------------------------------------------------------------
    // GAME OVER & VICTORY (First to clear assigned coins wins!)
    // -------------------------------------------------------------
    function checkGameOver() {
      if (gameOver) return true;

      const hasWhite = coins.some(c => c.type === 'white');
      const hasBlack = coins.some(c => c.type === 'black');

      if (!hasWhite || !hasBlack || coins.length === 0) {
        let winnerPlayer = null;
        let winnerReason = '';

        if (!hasWhite && hasBlack) {
          winnerPlayer = p1;
          winnerReason = `${p1.username} cleared all White coins first!`;
        } else if (!hasBlack && hasWhite) {
          winnerPlayer = p2;
          winnerReason = `${p2.username} cleared all Black coins first!`;
        } else {
          // If both cleared simultaneously or queen cleared, compare points
          if (pScore > aScore) {
            winnerPlayer = p1;
            winnerReason = `${p1.username} won on points (${pScore} vs ${aScore})!`;
          } else if (aScore > pScore) {
            winnerPlayer = p2;
            winnerReason = `${p2.username} won on points (${aScore} vs ${pScore})!`;
          } else {
            winnerPlayer = null;
            winnerReason = `Equal points (${pScore} - ${aScore})! Match Tied!`;
          }
        }

        triggerGameOver(winnerPlayer ? winnerPlayer.id : null, winnerReason);
        return true;
      }
      return false;
    }

    function triggerGameOver(winnerId, customReason = '') {
      gameOver = true;
      clearTimeout(aiTimer);
      moving = false;
      movingStartTime = 0;

      const modal = document.getElementById('gameOverModal');
      const winnerText = document.getElementById('winnerText');
      const winnerSubtext = document.getElementById('winnerSubtext');
      const winnerIcon = document.getElementById('winnerIcon');
      const finalPScore = document.getElementById('finalPScore');
      const finalAScore = document.getElementById('finalAScore');

      if (finalPScore) finalPScore.textContent = `${pScore} Pkts`;
      if (finalAScore) finalAScore.textContent = `${aScore} Pkts`;

      const winner = (winnerId === 'p1' || winnerId === p1.id) ? p1 : ((winnerId === 'p2' || winnerId === p2.id) ? p2 : null);

      if (winner) {
        winnerText.textContent = `${winner.username.toUpperCase()} WON!`;
        winnerText.className = (winner === p1) ? "text-xl font-black orbitron text-amber-400" : "text-xl font-black orbitron text-rose-400";
        winnerSubtext.textContent = customReason || `${winner.username} cleared all designated coins!`;
        winnerIcon.innerHTML = `<i class="fa-solid fa-trophy ${winner === p1 ? 'text-amber-400' : 'text-rose-400'} text-3xl animate-bounce"></i>`;
        document.getElementById('statusBanner').textContent = `MATCH OVER — ${winner.username.toUpperCase()} WON!`;
      } else {
        winnerText.textContent = "MATCH TIED!";
        winnerText.className = "text-xl font-black orbitron text-cyan-400";
        winnerSubtext.textContent = customReason || "Equal points pocketed!";
        winnerIcon.innerHTML = '<i class="fa-solid fa-handshake text-cyan-400 text-3xl"></i>';
        document.getElementById('statusBanner').textContent = "MATCH FINISHED — TIED!";
      }

      if (modal) modal.classList.remove('hidden');
    }

    function returnCoinToCenter(type) {
      let cx = SIZE / 2;
      let cy = SIZE / 2;
      let attempts = 0;
      while (coins.some(c => Math.hypot(c.x - cx, c.y - cy) < 26) && attempts < 10) {
        cx = SIZE / 2 + (Math.random() - 0.5) * 35;
        cy = SIZE / 2 + (Math.random() - 0.5) * 35;
        attempts++;
      }
      coins.push({
        x: cx,
        y: cy,
        radius: 12,
        vx: 0,
        vy: 0,
        type: type,
        color: (type === 'white') ? '#FFFFFF' : '#1E293B'
      });
    }

    // -------------------------------------------------------------
    // FIXED TIMESTEP PHYSICS & MAIN LOOP (60Hz Synchronous Execution)
    // -------------------------------------------------------------
    const FIXED_DT = 1000 / 60; // 16.666ms per physics step
    let lastFrameTime = performance.now();
    let accumulator = 0;
    let strikerFoul = false;
    let movingStartTime = 0;

    function physicsStep() {
      if (gameOver) return;

      const allObjects = [striker, ...coins];

      // Update positions
      allObjects.forEach(obj => {
        obj.x += obj.vx;
        obj.y += obj.vy;
        obj.vx *= FRICTION;
        obj.vy *= FRICTION;

        if (Math.hypot(obj.vx, obj.vy) < 0.08) {
          obj.vx = 0;
          obj.vy = 0;
        }

        // Wooden Border Bounces
        if (obj.x - obj.radius < 25) { obj.x = 25 + obj.radius; obj.vx *= -0.85; }
        if (obj.x + obj.radius > SIZE - 25) { obj.x = SIZE - 25 - obj.radius; obj.vx *= -0.85; }
        if (obj.y - obj.radius < 25) { obj.y = 25 + obj.radius; obj.vy *= -0.85; }
        if (obj.y + obj.radius > SIZE - 25) { obj.y = SIZE - 25 - obj.radius; obj.vy *= -0.85; }
      });

      // Coin & Striker Collisions: Positional Correction + Approach Check (Eliminates Jitter/Sticking)
      for (let i = 0; i < allObjects.length; i++) {
        for (let j = i + 1; j < allObjects.length; j++) {
          const a = allObjects[i];
          const b = allObjects[j];
          const dist = Math.hypot(b.x - a.x, b.y - a.y);
          const minDist = a.radius + b.radius;
          if (dist < minDist && dist > 0) {
            const nx = (b.x - a.x) / dist;
            const ny = (b.y - a.y) / dist;

            // 1. Positional correction: separate overlapping pairs along normal by overlap / 2
            const overlap = minDist - dist;
            const sep = overlap / 2;
            a.x -= nx * sep;
            a.y -= ny * sep;
            b.x += nx * sep;
            b.y += ny * sep;

            // 2. Approach check: only apply impulse when bodies are approaching each other
            const kx = a.vx - b.vx;
            const ky = a.vy - b.vy;
            const approach = nx * kx + ny * ky;
            if (approach > 0) {
              const restitution = 0.92;
              const p = (1 + restitution) * approach / 2;
              a.vx -= p * nx;
              a.vy -= p * ny;
              b.vx += p * nx;
              b.vy += p * ny;
            }
          }
        }
      }

      // Check Striker in Pocket (Foul)
      if (moving && !strikerFoul) {
        if (pockets.some(p => Math.hypot(striker.x - p.x, striker.y - p.y) < POCKET_RADIUS)) {
          strikerFoul = true;
          striker.vx = 0;
          striker.vy = 0;
          striker.x = -100;
          striker.y = -100;
        }
      }

      // Check Coins in Pockets
      for (let i = coins.length - 1; i >= 0; i--) {
        const c = coins[i];
        if (pockets.some(p => Math.hypot(c.x - p.x, c.y - p.y) < POCKET_RADIUS)) {
          if (c.type === 'white') {
            pScore++;
            pocketedWhiteThisTurn++;
          } else if (c.type === 'black') {
            aScore++;
            pocketedBlackThisTurn++;
          } else {
            // Queen
            if (isWhiteTurn) { pScore += 3; pocketedWhiteThisTurn++; }
            else { aScore += 3; pocketedBlackThisTurn++; }
          }
          coins.splice(i, 1);
          document.getElementById('playerScoreText').textContent = `${pScore} Pkts`;
          document.getElementById('aiScoreText').textContent = `${aScore} Pkts`;
        }
      }

      // Watchdog: If moving for > 10s, force stop all motion to prevent freeze
      if (moving) {
        if (!movingStartTime) movingStartTime = performance.now();
        if (performance.now() - movingStartTime > 10000) {
          allObjects.forEach(o => { o.vx = 0; o.vy = 0; });
        }
      } else {
        movingStartTime = 0;
      }

      // Check if all motion has ceased
      if (moving && allObjects.every(o => Math.hypot(o.vx, o.vy) === 0)) {
        moving = false;
        movingStartTime = 0;

        // Handle Striker Foul Penalty
        if (strikerFoul) {
          const banner = document.getElementById('statusBanner');
          if (banner) {
            banner.textContent = "⚠️ FOUL! STRIKER POCKETED! (PENALTY -1)";
            banner.className = "orbitron font-extrabold text-[10px] sm:text-xs text-rose-400 tracking-wide text-center truncate px-1";
          }
          // Return 1 pocketed coin to center if score > 0
          if (isWhiteTurn && pScore > 0) {
            pScore--;
            document.getElementById('playerScoreText').textContent = `${pScore} Pkts`;
            returnCoinToCenter('white');
          } else if (!isWhiteTurn && aScore > 0) {
            aScore--;
            document.getElementById('aiScoreText').textContent = `${aScore} Pkts`;
            returnCoinToCenter('black');
          }
          strikerFoul = false;
          // Turn passes to opponent on foul
          isWhiteTurn = !isWhiteTurn;
          resetStrikerForTurn();
          updateStatusBanner();

          if (isPartyMode) {
            sendPartyAction({
              action: 'CARROM_TURN_RESULT',
              coins: coins.map(c => ({ x: c.x, y: c.y, type: c.type, color: c.color })),
              pScore: pScore,
              aScore: aScore,
              nextTurn: isWhiteTurn
            });
          }
          return;
        }

        const isOver = checkGameOver();

        if (isPartyMode) {
          const iWasShooter = isWhiteTurn ? Boolean(p1.isMe) : Boolean(p2.isMe);
          if (iWasShooter) {
            let nextTurnIsWhite = isWhiteTurn;
            if (!isOver) {
              const pocketedOwn = isWhiteTurn ? (pocketedWhiteThisTurn > 0) : (pocketedBlackThisTurn > 0);
              if (!pocketedOwn) {
                nextTurnIsWhite = !isWhiteTurn;
              }
              isWhiteTurn = nextTurnIsWhite;
              resetStrikerForTurn();
              updateStatusBanner();
            }

            // Always broadcast turn result or game over!
            sendPartyAction({
              action: isOver ? 'CARROM_GAME_OVER' : 'CARROM_TURN_RESULT',
              coins: coins.map(c => ({ x: c.x, y: c.y, type: c.type, color: c.color })),
              pScore: pScore,
              aScore: aScore,
              nextTurn: isWhiteTurn,
              isGameOver: isOver,
              winnerPlayerId: isOver ? (pScore > aScore ? p1.id : p2.id) : null
            });
          } else {
            // Non-shooter waits for shooter's authoritative sync
            updateStatusBanner();
            clearTimeout(window._carromSyncTimeout);
            window._carromSyncTimeout = setTimeout(() => {
              if (!moving && isPartyMode) {
                const pocketedOwn = isWhiteTurn ? (pocketedWhiteThisTurn > 0) : (pocketedBlackThisTurn > 0);
                let nextTurnIsWhite = isWhiteTurn;
                if (!pocketedOwn) nextTurnIsWhite = !isWhiteTurn;
                isWhiteTurn = nextTurnIsWhite;
                resetStrikerForTurn();
                updateStatusBanner();
              }
            }, 2500);
          }
        } else {
          // AI or Pass & Play Mode
          if (!isOver) {
            const pocketedOwn = isWhiteTurn ? (pocketedWhiteThisTurn > 0) : (pocketedBlackThisTurn > 0);
            let nextTurnIsWhite = isWhiteTurn;
            if (!pocketedOwn) {
              nextTurnIsWhite = !isWhiteTurn;
            }
            isWhiteTurn = nextTurnIsWhite;
            resetStrikerForTurn();
            updateStatusBanner();

            if (!isPassPlay && !isWhiteTurn) {
              clearTimeout(aiTimer);
              aiTimer = setTimeout(aiTurn, 1000);
            }
          }
        }
      }
    }

    function update(currentTime) {
      // Loop NEVER dies: ALWAYS schedules next animation frame
      requestAnimationFrame(update);

      if (!currentTime) currentTime = performance.now();
      let elapsed = currentTime - lastFrameTime;
      lastFrameTime = currentTime;

      // Cap accumulator to avoid spiral of death on tab switch
      if (elapsed > 180) elapsed = 180;
      accumulator += elapsed;

      let steps = 0;
      while (accumulator >= FIXED_DT && steps < 5) {
        physicsStep();
        accumulator -= FIXED_DT;
        steps++;
      }

      render();
    }

    // -------------------------------------------------------------
    // AI BOT TURN (ONLY CALLED IN SINGLE-PLAYER MODE)
    // -------------------------------------------------------------
    function aiTurn() {
      if (gameOver || isPartyMode || isPassPlay || isWhiteTurn) return;

      const target = coins.find(c => c.type === 'black') || coins[0];
      if (!target) {
        checkGameOver();
        return;
      }

      const angle = Math.atan2(target.y - striker.y, target.x - striker.x);
      const power = 13 + Math.random() * 3.5;
      striker.vx = Math.cos(angle) * power;
      striker.vy = Math.sin(angle) * power;
      moving = true;
      updateStatusBanner();
    }

    // -------------------------------------------------------------
    // BOARD RENDERING
    // -------------------------------------------------------------
    function render() {
      ctx.clearRect(0, 0, SIZE, SIZE);

      ctx.save();
      if (isFlipped) {
        ctx.translate(SIZE, SIZE);
        ctx.rotate(Math.PI);
      }

      // Wooden Surface
      ctx.fillStyle = '#FED7AA';
      ctx.fillRect(20, 20, SIZE - 40, SIZE - 40);

      // Inner Baselines
      ctx.strokeStyle = '#9A3412';
      ctx.lineWidth = 2;
      ctx.strokeRect(60, 60, SIZE - 120, SIZE - 120);

      // White Bottom Baseline
      ctx.strokeStyle = isWhiteTurn ? '#DC2626' : '#B45309';
      ctx.lineWidth = isWhiteTurn ? 3 : 1.5;
      ctx.beginPath();
      ctx.moveTo(80, BASE_Y_WHITE);
      ctx.lineTo(SIZE - 80, BASE_Y_WHITE);
      ctx.stroke();

      // Black Top Baseline
      ctx.strokeStyle = !isWhiteTurn ? '#DC2626' : '#B45309';
      ctx.lineWidth = !isWhiteTurn ? 3 : 1.5;
      ctx.beginPath();
      ctx.moveTo(80, BASE_Y_BLACK);
      ctx.lineTo(SIZE - 80, BASE_Y_BLACK);
      ctx.stroke();

      // Center Circle & Concentric Patterns
      ctx.strokeStyle = '#9A3412';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(SIZE / 2, SIZE / 2, 45, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(SIZE / 2, SIZE / 2, 16, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(154, 52, 18, 0.2)';
      ctx.fill();
      ctx.stroke();

      // Corner Pockets
      pockets.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, POCKET_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = '#0F172A';
        ctx.fill();
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 3;
        ctx.stroke();
      });

      // Draw Coins
      coins.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
        ctx.fillStyle = c.color;
        ctx.fill();
        ctx.strokeStyle = (c.type === 'white') ? '#CBD5E1' : ((c.type === 'queen') ? '#FECDD3' : '#F59E0B');
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // Draw Striker with Turn Glow
      ctx.save();
      if (!moving && isMyTurnNow()) {
        const pulse = (Math.sin(Date.now() / 150) + 1) * 3;
        ctx.beginPath();
        ctx.arc(striker.x, striker.y, striker.radius + pulse, 0, Math.PI * 2);
        ctx.strokeStyle = '#00F0FF';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(striker.x, striker.y, striker.radius, 0, Math.PI * 2);
      ctx.fillStyle = striker.color;
      ctx.fill();
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Decorative inner ring on striker
      ctx.beginPath();
      ctx.arc(striker.x, striker.y, striker.radius * 0.45, 0, Math.PI * 2);
      ctx.strokeStyle = isWhiteTurn ? '#FEE2E2' : '#F59E0B';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();

      // Draw Aiming Guide Line
      if (isAiming && aimStart && aimCurrent) {
        const dx = aimStart.x - aimCurrent.x;
        const dy = aimStart.y - aimCurrent.y;
        const dist = Math.hypot(dx, dy);

        // Forward trajectory line
        ctx.save();
        ctx.beginPath();
        ctx.setLineDash([6, 6]);
        ctx.moveTo(striker.x, striker.y);
        ctx.lineTo(striker.x + dx * 2, striker.y + dy * 2);
        ctx.strokeStyle = '#00F0FF';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.setLineDash([]);

        // Pullback vector
        ctx.beginPath();
        ctx.moveTo(aimStart.x, aimStart.y);
        ctx.lineTo(aimCurrent.x, aimCurrent.y);
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.7)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }

      ctx.restore();
    }

    // Initialize
    setupCoins();
    resetStrikerForTurn();
    updateStatusBanner();
    update();
  </script>
</body>
</html>
