<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voltixz Ludo — Multiplayer & AI Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0B0E1A;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      user-select: none;
      touch-action: manipulation;
    }
    
    /* 3D Classic White Dice with black & red pips */
    .dice-cube {
      width: 46px;
      height: 46px;
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 4px 0 #CBD5E1, 0 6px 14px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .dice-cube.active-turn {
      animation: dicePulse 1.2s infinite alternate ease-in-out;
      border: 2px solid #00F0FF;
    }
    @keyframes dicePulse {
      0% { transform: scale(1); box-shadow: 0 4px 0 #CBD5E1, 0 0 10px rgba(0, 240, 255, 0.5); }
      100% { transform: scale(1.08); box-shadow: 0 5px 0 #CBD5E1, 0 0 18px rgba(0, 240, 255, 0.9); }
    }
    .dice-cube:active {
      transform: translateY(3px) scale(0.98);
      box-shadow: 0 1px 0 #CBD5E1, 0 3px 6px rgba(0,0,0,0.4);
    }
    
    @keyframes rollShake {
      0% { transform: rotate(0deg) scale(0.9); }
      20% { transform: rotate(-25deg) scale(1.1); }
      40% { transform: rotate(25deg) scale(1.15); }
      60% { transform: rotate(-15deg) scale(1.05); }
      80% { transform: rotate(15deg) scale(1.1); }
      100% { transform: rotate(0deg) scale(1); }
    }
    .rolling {
      animation: rollShake 0.4s ease-in-out;
    }

    .dice-pip {
      width: 8px;
      height: 8px;
      background: #1E293B;
      border-radius: 50%;
    }
    .red-pip {
      background: #DC2626 !important;
      width: 11px !important;
      height: 11px !important;
    }

    /* Pawn highlight glow */
    .movable-token {
      filter: drop-shadow(0 0 8px #FFD700) drop-shadow(0 0 14px #FF0000);
      cursor: pointer;
      animation: tokenBounce 0.8s infinite alternate ease-in-out;
    }
    @keyframes tokenBounce {
      0% { transform: scale(1); }
      100% { transform: scale(1.18); }
    }
  </style>
</head>
<body class="h-full w-full flex flex-col items-center justify-between p-1.5 sm:p-2.5 max-w-lg mx-auto box-border overflow-hidden">

  <!-- Top Realtime Players Status Bar -->
  <div id="playersStatusBar" class="w-full shrink-0 flex items-center justify-between bg-slate-900/90 border border-slate-700/60 px-2 sm:px-3 py-1.5 rounded-xl shadow-lg gap-1.5">
    <!-- Rendered dynamically for connected players -->
  </div>

  <!-- Real Authentic 15x15 Ludo Board -->
  <div class="flex-1 min-h-0 w-full flex items-center justify-center py-1 overflow-hidden">
    <div class="h-full aspect-square max-w-full p-1 sm:p-1.5 bg-slate-800 rounded-xl sm:rounded-2xl shadow-2xl border-2 sm:border-4 border-slate-700 flex items-center justify-center">
      <canvas id="ludoCanvas" class="w-full h-full rounded-lg sm:rounded-xl bg-white shadow-inner"></canvas>
    </div>
  </div>

  <!-- Bottom Control Deck: Real White Dice & Info -->
  <div class="w-full shrink-0 bg-slate-900/95 border border-slate-700/80 rounded-xl sm:rounded-2xl px-3 py-1.5 sm:py-2 flex items-center justify-between shadow-xl">
    
    <div class="flex flex-col max-w-[130px]">
      <span class="text-[10px] sm:text-[11px] font-bold text-gray-200 truncate" id="actionHint">Click dice to roll!</span>
      <span class="text-[9px] sm:text-[10px] text-gray-400" id="actionSubHint">Roll 6 to open token</span>
    </div>

    <!-- The 3D Dice with big clickable hit area -->
    <div id="diceTouchWrapper" onclick="onDiceClick()" class="flex flex-col items-center cursor-pointer p-1 active:scale-95 transition-transform select-none">
      <div id="diceCube" class="dice-cube select-none active-turn">
        <!-- Pips rendered dynamically -->
        <div id="diceGrid" class="grid grid-cols-3 gap-1 p-1 w-full h-full items-center justify-items-center pointer-events-none">
          <div class="col-start-2 dice-pip red-pip"></div>
        </div>
      </div>
      <span class="text-[10px] sm:text-[11px] font-black text-cyan-300 mt-1 uppercase tracking-wider bg-cyan-950/90 px-2.5 py-0.5 rounded-full border border-cyan-400/50 shadow-md shadow-cyan-500/20" id="diceLabel">TAP TO ROLL</span>
    </div>

    <div class="flex flex-col text-right max-w-[130px]">
      <span class="text-[10px] sm:text-[11px] font-bold text-emerald-400" id="gameModeBadge">Multiplayer</span>
      <span class="text-[9px] sm:text-[10px] text-gray-400">Safe stars & capture</span>
    </div>

  </div>

  <!-- Victory Win Modal -->
  <div id="winModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center space-y-4">
    <div class="w-20 h-20 rounded-2xl bg-amber-500/20 border-2 border-amber-400 flex items-center justify-center text-amber-400 text-4xl animate-bounce">
      <i class="fa-solid fa-trophy"></i>
    </div>
    <h2 class="font-black text-2xl sm:text-3xl text-white" id="modalTitle">🏆 PLAYER WINS!</h2>
    <p class="text-xs text-gray-300" id="modalDesc">All 4 tokens successfully reached Home!</p>
    <div class="flex gap-3 w-full max-w-xs pt-2">
      <button onclick="resetGame()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-extrabold text-xs uppercase hover:opacity-90">
        Play Again
      </button>
      <button onclick="window.parent.closeGameTheater()" class="flex-1 py-3 rounded-xl bg-white/10 border border-white/20 text-white font-bold text-xs hover:bg-white/20">
        Exit to Lobby
      </button>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // URL PARAMETERS & MULTIPLAYER SETUP
    // -------------------------------------------------------------
    const urlParams = new URLSearchParams(window.location.search);
    const gameMode = urlParams.get('mode') || 'ai'; // 'party', 'passplay', or 'ai'
    const isPartyMode = (gameMode === 'party');
    const isPassPlay = (gameMode === 'passplay');
    const myUserId = String(urlParams.get('myId') || '');
    const myUsername = String(urlParams.get('myUsername') || '');
    const myPlayerIndexParam = urlParams.get('myPlayerIndex');
    const myPlayerIndex = (myPlayerIndexParam !== null && myPlayerIndexParam !== '') ? parseInt(myPlayerIndexParam, 10) : -1;
    const isHostParam = (urlParams.get('isHost') === 'true');
    let turnTimer = null;
    let remoteRollTimer = null;

    // Color configs
    const PLAYER_CONFIG = {
      RED: { base: '#DC2626', dark: '#991B1B', name: 'RED', border: '#EF4444' },
      GREEN: { base: '#16A34A', dark: '#166534', name: 'GREEN', border: '#22C55E' },
      YELLOW: { base: '#CA8A04', dark: '#854D0E', name: 'YELLOW', border: '#EAB308' },
      BLUE: { base: '#2563EB', dark: '#1E40AF', name: 'BLUE', border: '#3B82F6' }
    };
    const COLOR_KEYS = ['RED', 'GREEN', 'YELLOW', 'BLUE'];

    // Resolve Active Players in this match
    let activePlayers = [];

    if (isPartyMode) {
      let passedPlayers = [];
      try {
        passedPlayers = JSON.parse(urlParams.get('players') || '[]');
      } catch (e) {}
      if (!passedPlayers || passedPlayers.length === 0) {
        if (window.parent?.activePartySession?.players) {
          passedPlayers = window.parent.activePartySession.players;
        }
      }

      if (Array.isArray(passedPlayers) && passedPlayers.length > 0) {
        activePlayers = passedPlayers.map((p, idx) => {
          const colorKey = COLOR_KEYS[idx % 4];
          let isThisPlayerMe = false;
          if (myPlayerIndex !== -1 && !isNaN(myPlayerIndex)) {
            isThisPlayerMe = (idx === myPlayerIndex);
          } else {
            isThisPlayerMe = (
              (myUserId && String(p.id) === String(myUserId)) ||
              (myUsername && p.username && p.username.toLowerCase() === myUsername.toLowerCase()) ||
              (isHostParam ? (idx === 0) : (idx === 1))
            );
          }
          return {
            id: p.id,
            username: p.username || `Player_${idx + 1}`,
            avatar_url: p.avatar_url || `https://api.dicebear.com/7.x/bottts/svg?seed=${p.username || idx}`,
            color: colorKey,
            isBot: p.isBot || false,
            isMe: isThisPlayerMe
          };
        });

        // Guaranteed fallback: ensure at least one player has isMe true
        if (!activePlayers.some(p => p.isMe)) {
          const fallbackIdx = isHostParam ? 0 : 1;
          if (activePlayers[fallbackIdx]) {
            activePlayers[fallbackIdx].isMe = true;
          } else if (activePlayers[0]) {
            activePlayers[0].isMe = true;
          }
        }
      } else {
        // Fallback: 2-player default
        activePlayers = [
          { id: 'p1', username: 'Host (You)', color: 'RED', isBot: false, isMe: isHostParam },
          { id: 'p2', username: 'Friend', color: 'GREEN', isBot: false, isMe: !isHostParam }
        ];
      }
    } else if (isPassPlay) {
      activePlayers = [
        { id: 'p1', username: 'Player 1', color: 'RED', isBot: false, isMe: true },
        { id: 'p2', username: 'Player 2', color: 'GREEN', isBot: false, isMe: true }
      ];
    } else {
      // Single player vs Computer AI
      activePlayers = [
        { id: 'p1', username: 'You', color: 'RED', isBot: false, isMe: true },
        { id: 'bot', username: 'AI Bot', color: 'GREEN', isBot: true, isMe: false }
      ];
    }

    window.activePlayers = activePlayers;

    // Determine if local player is the host (player 0)
    const isHost = activePlayers[0] && activePlayers[0].isMe;
    const myPlayer = activePlayers.find(p => p.isMe) || activePlayers[0];

    // Badge label
    const modeBadge = document.getElementById('gameModeBadge');
    if (modeBadge) {
      modeBadge.textContent = isPartyMode ? 'Party Live' : (isPassPlay ? 'Pass & Play' : 'Vs Smart AI');
    }

    // -------------------------------------------------------------
    // CANVAS & AUDIO SETUP
    // -------------------------------------------------------------
    const canvas = document.getElementById('ludoCanvas');
    const ctx = canvas.getContext('2d');
    const GRID_SIZE = 15;
    const CANVAS_SIZE = 600;
    canvas.width = CANVAS_SIZE;
    canvas.height = CANVAS_SIZE;
    const CELL = CANVAS_SIZE / GRID_SIZE; // 40px

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(type) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const t = audioCtx.currentTime;

        if (type === 'roll') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, t);
          osc.frequency.exponentialRampToValueAtTime(150, t + 0.15);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.linearRampToValueAtTime(0, t + 0.15);
          osc.start(t);
          osc.stop(t + 0.15);
        } else if (type === 'move') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(550, t);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.linearRampToValueAtTime(0, t + 0.08);
          osc.start(t);
          osc.stop(t + 0.08);
        } else if (type === 'capture') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, t);
          osc.frequency.exponentialRampToValueAtTime(700, t + 0.25);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.linearRampToValueAtTime(0, t + 0.25);
          osc.start(t);
          osc.stop(t + 0.25);
        } else if (type === 'home') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523, t);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.linearRampToValueAtTime(0, t + 0.3);
          osc.start(t);
          osc.stop(t + 0.3);
        }
      } catch (e) {}
    }

    // -------------------------------------------------------------
    // CLASSIC LUDO TRACK & HOME PATH COORDINATES (15x15 Indian Board)
    // -------------------------------------------------------------
    const TRACK_COORDS = [
      // Red arm bottom to top
      { r: 6, c: 1 }, { r: 6, c: 2 }, { r: 6, c: 3 }, { r: 6, c: 4 }, { r: 6, c: 5 },
      // Top arm left column going up
      { r: 5, c: 6 }, { r: 4, c: 6 }, { r: 3, c: 6 }, { r: 2, c: 6 }, { r: 1, c: 6 }, { r: 0, c: 6 },
      // Top edge
      { r: 0, c: 7 }, { r: 0, c: 8 },
      // Top arm right column going down (Green start at index 13: r 1, c 8)
      { r: 1, c: 8 }, { r: 2, c: 8 }, { r: 3, c: 8 }, { r: 4, c: 8 }, { r: 5, c: 8 },
      // Right arm top row going right
      { r: 6, c: 9 }, { r: 6, c: 10 }, { r: 6, c: 11 }, { r: 6, c: 12 }, { r: 6, c: 13 }, { r: 6, c: 14 },
      // Right edge
      { r: 7, c: 14 }, { r: 8, c: 14 },
      // Right arm bottom row going left (Yellow start at index 26: r 8, c 13)
      { r: 8, c: 13 }, { r: 8, c: 12 }, { r: 8, c: 11 }, { r: 8, c: 10 }, { r: 8, c: 9 },
      // Bottom arm right column going down
      { r: 9, c: 8 }, { r: 10, c: 8 }, { r: 11, c: 8 }, { r: 12, c: 8 }, { r: 13, c: 8 }, { r: 14, c: 8 },
      // Bottom edge
      { r: 14, c: 7 }, { r: 14, c: 6 },
      // Bottom arm left column going up (Blue start at index 39: r 13, c 6)
      { r: 13, c: 6 }, { r: 12, c: 6 }, { r: 11, c: 6 }, { r: 10, c: 6 }, { r: 9, c: 6 },
      // Left arm bottom row going left
      { r: 8, c: 5 }, { r: 8, c: 4 }, { r: 8, c: 3 }, { r: 8, c: 2 }, { r: 8, c: 1 }, { r: 8, c: 0 },
      // Left edge
      { r: 7, c: 0 }, { r: 6, c: 0 }
    ]; // Exactly 52 common tiles (0 to 51)

    // Home paths leading to center: 5 squares per color (steps 51 to 55; step 56 is Home)
    const RED_HOME_PATH = [ { r: 7, c: 1 }, { r: 7, c: 2 }, { r: 7, c: 3 }, { r: 7, c: 4 }, { r: 7, c: 5 } ];
    const GREEN_HOME_PATH = [ { r: 1, c: 7 }, { r: 2, c: 7 }, { r: 3, c: 7 }, { r: 4, c: 7 }, { r: 5, c: 7 } ];
    const YELLOW_HOME_PATH = [ { r: 7, c: 13 }, { r: 7, c: 12 }, { r: 7, c: 11 }, { r: 7, c: 10 }, { r: 7, c: 9 } ];
    const BLUE_HOME_PATH = [ { r: 13, c: 7 }, { r: 12, c: 7 }, { r: 11, c: 7 }, { r: 10, c: 7 }, { r: 9, c: 7 } ];

    const TRACK_OFFSETS = { RED: 0, GREEN: 13, YELLOW: 26, BLUE: 39 };
    const HOME_PATHS = { RED: RED_HOME_PATH, GREEN: GREEN_HOME_PATH, YELLOW: YELLOW_HOME_PATH, BLUE: BLUE_HOME_PATH };

    // Safe Squares
    const SAFE_SQUARES = [
      { r: 6, c: 1 },  // Red Start
      { r: 2, c: 6 },  // Safe Star
      { r: 1, c: 8 },  // Green Start
      { r: 6, c: 12 }, // Safe Star
      { r: 8, c: 13 }, // Yellow Start
      { r: 12, c: 8 }, // Safe Star
      { r: 13, c: 6 }, // Blue Start
      { r: 8, c: 2 }   // Safe Star
    ];
    function isSafeSquare(r, c) {
      return SAFE_SQUARES.some(s => s.r === r && s.c === c);
    }

    // Base slots
    const BASE_SLOTS = {
      RED: [ { r: 2, c: 2 }, { r: 2, c: 3 }, { r: 3, c: 2 }, { r: 3, c: 3 } ],
      GREEN: [ { r: 2, c: 11 }, { r: 2, c: 12 }, { r: 3, c: 11 }, { r: 3, c: 12 } ],
      YELLOW: [ { r: 11, c: 11 }, { r: 11, c: 12 }, { r: 12, c: 11 }, { r: 12, c: 12 } ],
      BLUE: [ { r: 11, c: 2 }, { r: 11, c: 3 }, { r: 12, c: 2 }, { r: 12, c: 3 } ]
    };

    // 4 tokens per color
    const tokens = {
      RED: [ { id: 1, step: -1, isHome: false }, { id: 2, step: -1, isHome: false }, { id: 3, step: -1, isHome: false }, { id: 4, step: -1, isHome: false } ],
      GREEN: [ { id: 1, step: -1, isHome: false }, { id: 2, step: -1, isHome: false }, { id: 3, step: -1, isHome: false }, { id: 4, step: -1, isHome: false } ],
      YELLOW: [ { id: 1, step: -1, isHome: false }, { id: 2, step: -1, isHome: false }, { id: 3, step: -1, isHome: false }, { id: 4, step: -1, isHome: false } ],
      BLUE: [ { id: 1, step: -1, isHome: false }, { id: 2, step: -1, isHome: false }, { id: 3, step: -1, isHome: false }, { id: 4, step: -1, isHome: false } ]
    };

    let currentTurnIndex = 0;
    let diceValue = null;
    let hasRolled = false;
    let isRolling = false;
    let isGameOver = false;

    function getTokenPos(playerColor, tokenIndex) {
      const token = tokens[playerColor] ? tokens[playerColor][tokenIndex] : null;
      if (!token) return { r: 7, c: 7 };

      if (token.isHome) {
        // Distinct neat placement inside each colored home triangle
        const homeOffsets = [
          { r: 0, c: 0 },
          { r: -0.25, c: 0.25 },
          { r: 0.25, c: -0.25 },
          { r: 0.25, c: 0.25 }
        ];
        const ho = homeOffsets[tokenIndex % 4];
        if (playerColor === 'RED') return { r: 7 + ho.r * 0.6, c: 6.6 + ho.c * 0.6 };
        if (playerColor === 'GREEN') return { r: 6.6 + ho.r * 0.6, c: 7 + ho.c * 0.6 };
        if (playerColor === 'YELLOW') return { r: 7 + ho.r * 0.6, c: 7.4 + ho.c * 0.6 };
        if (playerColor === 'BLUE') return { r: 7.4 + ho.r * 0.6, c: 7 + ho.c * 0.6 };
        return { r: 7, c: 7 };
      }

      if (token.step === -1) {
        const slots = BASE_SLOTS[playerColor] || BASE_SLOTS.RED;
        return slots[tokenIndex % slots.length];
      }

      const offset = TRACK_OFFSETS[playerColor] || 0;
      if (token.step < 51) {
        const trackIdx = (offset + token.step) % TRACK_COORDS.length;
        return TRACK_COORDS[trackIdx] || { r: 7, c: 7 };
      } else {
        const homeIdx = token.step - 51;
        const hp = HOME_PATHS[playerColor] || HOME_PATHS.RED;
        return hp[Math.min(homeIdx, hp.length - 1)] || { r: 7, c: 7 };
      }
    }

    function canPawnMove(token, roll) {
      if (!token || token.isHome) return false;
      if (token.step === -1) return roll === 6;
      return (token.step + roll) <= 56;
    }

    // -------------------------------------------------------------
    // RENDER TOP STATUS BAR & BOARD
    // -------------------------------------------------------------
    function updateStatusBar() {
      const bar = document.getElementById('playersStatusBar');
      if (!bar) return;

      bar.innerHTML = activePlayers.map((p, idx) => {
        const isCurrent = (idx === currentTurnIndex);
        const homeCount = tokens[p.color].filter(t => t.isHome).length;
        const cfg = PLAYER_CONFIG[p.color];

        return `
          <div class="flex items-center gap-1.5 px-2 py-1 rounded-xl transition-all ${isCurrent ? 'bg-white/10 ring-2 ring-cyan-400' : 'bg-black/30 opacity-75'}">
            <div class="w-3.5 h-3.5 rounded-full shrink-0 shadow" style="background-color: ${cfg.base}; border: 2px solid #fff"></div>
            <div class="flex flex-col min-w-0">
              <span class="text-[10px] sm:text-[11px] font-black truncate leading-tight ${isCurrent ? 'text-white' : 'text-gray-300'}">
                ${p.username} ${p.isMe ? '<span class="text-[8.5px] text-cyan-300">(You)</span>' : ''}
              </span>
              <span class="text-[9px] text-gray-400 leading-none">${homeCount}/4 Home</span>
            </div>
            ${isCurrent ? '<i class="fa-solid fa-dice text-[11px] text-cyan-300 animate-spin-slow ml-1"></i>' : ''}
          </div>
        `;
      }).join('');
    }

    function renderDiceFace(val) {
      const grid = document.getElementById('diceGrid');
      const pipMap = {
        1: '<div class="col-start-2 row-start-2 dice-pip red-pip"></div>',
        2: '<div class="col-start-1 row-start-1 dice-pip"></div><div class="col-start-3 row-start-3 dice-pip"></div>',
        3: '<div class="col-start-1 row-start-1 dice-pip"></div><div class="col-start-2 row-start-2 dice-pip"></div><div class="col-start-3 row-start-3 dice-pip"></div>',
        4: '<div class="col-start-1 row-start-1 dice-pip"></div><div class="col-start-3 row-start-1 dice-pip"></div><div class="col-start-1 row-start-3 dice-pip"></div><div class="col-start-3 row-start-3 dice-pip"></div>',
        5: '<div class="col-start-1 row-start-1 dice-pip"></div><div class="col-start-3 row-start-1 dice-pip"></div><div class="col-start-2 row-start-2 dice-pip"></div><div class="col-start-1 row-start-3 dice-pip"></div><div class="col-start-3 row-start-3 dice-pip"></div>',
        6: '<div class="col-start-1 row-start-1 dice-pip"></div><div class="col-start-3 row-start-1 dice-pip"></div><div class="col-start-1 row-start-2 dice-pip"></div><div class="col-start-3 row-start-2 dice-pip"></div><div class="col-start-1 row-start-3 dice-pip"></div><div class="col-start-3 row-start-3 dice-pip"></div>'
      };
      grid.innerHTML = pipMap[val] || pipMap[1];
    }

    function renderBoard() {
      ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

      // 1. White Grid
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

      ctx.strokeStyle = '#CBD5E1';
      ctx.lineWidth = 1;
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          ctx.strokeRect(c * CELL, r * CELL, CELL, CELL);
        }
      }

      // 2. Corner Base Boxes
      drawBaseBox(0, 0, '#DC2626', BASE_SLOTS.RED);
      drawBaseBox(9, 0, '#16A34A', BASE_SLOTS.GREEN);
      drawBaseBox(0, 9, '#2563EB', BASE_SLOTS.BLUE);
      drawBaseBox(9, 9, '#CA8A04', BASE_SLOTS.YELLOW);

      // 3. Colored Paths & Home Runs
      // Red Start Square (row 6, col 1) & Home Row (row 7, col 1..5)
      fillCell(6, 1, '#DC2626');
      drawStar(6, 1, '#FFFFFF');
      for (let c = 1; c <= 5; c++) fillCell(7, c, '#DC2626');

      // Green Start Square (row 1, col 8) & Home Row (col 7, row 1..5)
      fillCell(1, 8, '#16A34A');
      drawStar(1, 8, '#FFFFFF');
      for (let r = 1; r <= 5; r++) fillCell(r, 7, '#16A34A');

      // Yellow Start Square (row 8, col 13) & Home Row (row 7, col 9..13)
      fillCell(8, 13, '#CA8A04');
      drawStar(8, 13, '#FFFFFF');
      for (let c = 9; c <= 13; c++) fillCell(7, c, '#CA8A04');

      // Blue Start Square (row 13, col 6) & Home Row (col 7, row 9..13)
      fillCell(13, 6, '#2563EB');
      drawStar(13, 6, '#FFFFFF');
      for (let r = 9; r <= 13; r++) fillCell(r, 7, '#2563EB');

      // Safe Stars on Track
      SAFE_SQUARES.forEach(s => {
        if (!((s.r === 6 && s.c === 1) || (s.r === 1 && s.c === 8) || (s.r === 8 && s.c === 13) || (s.r === 13 && s.c === 6))) {
          drawStar(s.r, s.c, '#94A3B8');
        }
      });

      // 4. Center Home Triangles
      drawCenterHome();

      // 5. Draw Pawns of all active players
      drawAllPawns();
    }

    function drawBaseBox(startCol, startRow, color, slots) {
      const x = startCol * CELL;
      const y = startRow * CELL;
      const w = 6 * CELL;
      const h = 6 * CELL;

      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);

      const pad = CELL;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(x + pad, y + pad, w - pad * 2, h - pad * 2);

      slots.forEach(slot => {
        const cx = (slot.c + 0.5) * CELL;
        const cy = (slot.r + 0.5) * CELL;
        ctx.beginPath();
        ctx.arc(cx, cy, CELL * 0.38, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      });
    }

    function fillCell(r, c, color) {
      ctx.fillStyle = color;
      ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
      ctx.strokeStyle = '#CBD5E1';
      ctx.lineWidth = 1;
      ctx.strokeRect(c * CELL, r * CELL, CELL, CELL);
    }

    function drawStar(r, c, color) {
      const cx = (c + 0.5) * CELL;
      const cy = (r + 0.5) * CELL;
      const spikes = 5;
      const outerRadius = CELL * 0.32;
      const innerRadius = CELL * 0.16;
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;
        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    function drawCenterHome() {
      const left = 6 * CELL;
      const right = 9 * CELL;
      const top = 6 * CELL;
      const bottom = 9 * CELL;
      const cx = 7.5 * CELL;
      const cy = 7.5 * CELL;

      // Red Triangle (Left)
      ctx.beginPath();
      ctx.moveTo(left, top);
      ctx.lineTo(cx, cy);
      ctx.lineTo(left, bottom);
      ctx.closePath();
      ctx.fillStyle = '#DC2626';
      ctx.fill();

      // Green Triangle (Top)
      ctx.beginPath();
      ctx.moveTo(left, top);
      ctx.lineTo(cx, cy);
      ctx.lineTo(right, top);
      ctx.closePath();
      ctx.fillStyle = '#16A34A';
      ctx.fill();

      // Yellow Triangle (Right)
      ctx.beginPath();
      ctx.moveTo(right, top);
      ctx.lineTo(cx, cy);
      ctx.lineTo(right, bottom);
      ctx.closePath();
      ctx.fillStyle = '#CA8A04';
      ctx.fill();

      // Blue Triangle (Bottom)
      ctx.beginPath();
      ctx.moveTo(left, bottom);
      ctx.lineTo(cx, cy);
      ctx.lineTo(right, bottom);
      ctx.closePath();
      ctx.fillStyle = '#2563EB';
      ctx.fill();
    }

    function drawAllPawns() {
      activePlayers.forEach((p, pIdx) => {
        const color = p.color;
        const cfg = PLAYER_CONFIG[color];
        const isMyTurn = (currentTurnIndex === pIdx) && p.isMe;

        tokens[color].forEach((t, i) => {
          const pos = getTokenPos(color, i);
          const canMove = isMyTurn && hasRolled && canPawnMove(t, diceValue);
          drawClassicPawn(pos.r, pos.c, cfg.base, cfg.dark, canMove);
        });
      });
    }

    let isPulsing = false;
    let animFrameId = null;

    function startPawnPulseAnimation() {
      if (isPulsing) return;
      isPulsing = true;
      function loop() {
        if (!isPulsing) return;
        renderBoard();
        animFrameId = requestAnimationFrame(loop);
      }
      animFrameId = requestAnimationFrame(loop);
    }

    function stopPawnPulseAnimation() {
      isPulsing = false;
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
    }

    function drawClassicPawn(r, c, baseColor, darkColor, isMovable) {
      if (typeof r !== 'number' || typeof c !== 'number' || isNaN(r) || isNaN(c)) return;
      const cx = (c + 0.5) * CELL;
      const cy = (r + 0.5) * CELL;

      ctx.save();
      if (isMovable) {
        // High-visibility animated pulse ring for touch targets
        const pulse = (Math.sin(Date.now() / 140) + 1) * 0.06;
        ctx.beginPath();
        ctx.arc(cx, cy, CELL * (0.5 + pulse), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 215, 0, 0.45)';
        ctx.fill();
        ctx.strokeStyle = '#F59E0B';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, CELL * (0.38 + pulse), 0, Math.PI * 2);
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.ellipse(cx, cy + CELL * 0.3, CELL * 0.28, CELL * 0.12, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy + CELL * 0.18, CELL * 0.32, 0, Math.PI * 2);
      ctx.fillStyle = darkColor;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy - CELL * 0.05, CELL * 0.24, 0, Math.PI * 2);
      ctx.fillStyle = baseColor;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy - CELL * 0.15, CELL * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy - CELL * 0.15, CELL * 0.17, 0, Math.PI * 2);
      ctx.fillStyle = baseColor;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx - CELL * 0.06, cy - CELL * 0.2, CELL * 0.05, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.fill();

      ctx.restore();
    }

    // -------------------------------------------------------------
    // TURN CONTROLS, AUTO-MOVE & SAFETY TIMERS
    // -------------------------------------------------------------
    let autoMoveTimer = null;
    let autoMoveSeconds = 0;
    let turnSafetyTimer = null;
    let lastDiceClickTime = 0;

    function clearAutoMoveTimer() {
      if (autoMoveTimer) {
        clearInterval(autoMoveTimer);
        autoMoveTimer = null;
      }
      stopPawnPulseAnimation();
    }

    function startAutoMoveCountdown(color, movable) {
      clearAutoMoveTimer();
      autoMoveSeconds = 8;
      startPawnPulseAnimation();

      const updateHint = () => {
        const actionHint = document.getElementById('actionHint');
        if (actionHint && hasRolled && !isRolling) {
          actionHint.textContent = `Tap token or dice to move! (${autoMoveSeconds}s)`;
        }
      };
      updateHint();

      autoMoveTimer = setInterval(() => {
        autoMoveSeconds--;
        if (autoMoveSeconds <= 0) {
          clearAutoMoveTimer();
          if (hasRolled && !isRolling && movable && movable.length > 0) {
            // Auto pick best pawn: priority open from base, then furthest along path
            const openMove = movable.find(m => m.t.step === -1);
            const chosen = openMove || movable.reduce((furthest, curr) => curr.t.step > furthest.t.step ? curr : furthest, movable[0]);
            const actionHint = document.getElementById('actionHint');
            if (actionHint) actionHint.textContent = `Auto-moving Token ${chosen.t.id}...`;
            executeMoveToken(color, chosen.idx, diceValue, true);
          }
        } else {
          updateHint();
        }
      }, 1000);
    }

    function clearTurnSafetyTimer() {
      if (turnSafetyTimer) {
        clearTimeout(turnSafetyTimer);
        turnSafetyTimer = null;
      }
    }

    function startTurnSafetyTimer() {
      clearTurnSafetyTimer();
      const activePlayer = activePlayers[currentTurnIndex];
      if (!activePlayer || isGameOver) return;

      // Local player turn: if not rolled within 15 seconds, auto-roll!
      if (activePlayer.isMe) {
        turnSafetyTimer = setTimeout(() => {
          if (!hasRolled && !isRolling && !isGameOver) {
            const hint = document.getElementById('actionHint');
            if (hint) hint.textContent = "Auto-rolling dice...";
            onDiceClick();
          }
        }, 15000);
      } else if (isPartyMode && isHost) {
        // Remote player turn: if host detects peer unresponsive for 25s, pass turn
        turnSafetyTimer = setTimeout(() => {
          if (!isGameOver) {
            const p = activePlayers[currentTurnIndex];
            if (p && !p.isMe) {
              advanceTurn(true);
            }
          }
        }, 25000);
      }
    }

    function updateTurnDisplay(isExtraTurn = false) {
      window.currentTurnIndex = currentTurnIndex;
      updateStatusBar();
      const activePlayer = activePlayers[currentTurnIndex];
      if (!activePlayer) return;

      const diceCube = document.getElementById('diceCube');
      const actionHint = document.getElementById('actionHint');
      const diceLabel = document.getElementById('diceLabel');

      if (activePlayer.isMe) {
        if (diceCube) diceCube.classList.add('active-turn');
        if (actionHint) actionHint.textContent = isExtraTurn ? "🎉 Extra turn! Roll again!" : "🎲 YOUR TURN — ROLL DICE!";
        if (diceLabel) diceLabel.textContent = "Your Turn";
      } else {
        if (diceCube) diceCube.classList.remove('active-turn');
        if (actionHint) actionHint.textContent = `Waiting for ${activePlayer.username} to roll...`;
        if (diceLabel) diceLabel.textContent = `${activePlayer.username}'s Turn`;
      }
    }

    function onDiceClick() {
      if (isGameOver) return;
      const now = Date.now();
      if (now - lastDiceClickTime < 220) return;
      lastDiceClickTime = now;

      const activePlayer = activePlayers[currentTurnIndex];
      if (!activePlayer) return;

      // In party mode: check if active player is me
      if (isPartyMode && !activePlayer.isMe) {
        const hint = document.getElementById('actionHint');
        if (hint) {
          hint.textContent = `⏳ Waiting for ${activePlayer.username}'s turn!`;
          hint.classList.add('text-amber-400');
          setTimeout(() => hint?.classList.remove('text-amber-400'), 1500);
        }
        playSfx('roll');
        return;
      }

      // If user rolled and taps dice again to auto-pick movable token or fast-pass:
      if (hasRolled && !isRolling) {
        clearAutoMoveTimer();
        const color = activePlayer.color;
        const movable = tokens[color]
          .map((t, idx) => ({ t, idx }))
          .filter(item => canPawnMove(item.t, diceValue));
        if (movable.length > 0) {
          const openMove = movable.find(m => m.t.step === -1);
          const chosen = openMove || movable.reduce((furthest, curr) => curr.t.step > furthest.t.step ? curr : furthest, movable[0]);
          executeMoveToken(color, chosen.idx, diceValue, true);
        } else {
          if (turnTimer) clearTimeout(turnTimer);
          advanceTurn(true);
        }
        return;
      }

      if (hasRolled || isRolling) return;

      clearTurnSafetyTimer();
      isRolling = true;
      const cube = document.getElementById('diceCube');
      if (cube) cube.classList.add('rolling');
      playSfx('roll');

      setTimeout(() => {
        diceValue = Math.floor(Math.random() * 6) + 1;
        if (cube) cube.classList.remove('rolling');
        renderDiceFace(diceValue);
        hasRolled = true;
        isRolling = false;

        const diceLabel = document.getElementById('diceLabel');
        if (diceLabel) diceLabel.textContent = `Rolled: ${diceValue}`;

        const color = activePlayer.color;
        const movable = tokens[color]
          .map((t, idx) => ({ t, idx }))
          .filter(item => canPawnMove(item.t, diceValue));
        const hasNoMoves = (movable.length === 0);
        const nextTurn = hasNoMoves ? ((currentTurnIndex + 1) % activePlayers.length) : currentTurnIndex;

        // Broadcast roll to peers over WebSocket
        if (isPartyMode) {
          sendPartyAction({
            action: 'LUDO_ROLL',
            roll: diceValue,
            playerIndex: currentTurnIndex,
            noMoves: hasNoMoves,
            nextTurnIndex: nextTurn
          });
        }

        if (hasNoMoves) {
          const actionHint = document.getElementById('actionHint');
          if (actionHint) actionHint.textContent = `No moves for ${diceValue}.`;
          if (turnTimer) clearTimeout(turnTimer);
          turnTimer = setTimeout(() => {
            advanceTurn(true);
          }, 900);
        } else if (movable.length === 1) {
          const actionHint = document.getElementById('actionHint');
          if (actionHint) actionHint.textContent = `Moving Token ${movable[0].t.id}...`;
          setTimeout(() => executeMoveToken(color, movable[0].idx, diceValue, true), 350);
        } else {
          // Multiple pawns can move: start 8-second auto-move countdown
          startAutoMoveCountdown(color, movable);
        }

        renderBoard();
      }, 400);
    }

    // Board touch & click interaction with generous hit radius
    function handleBoardInteraction(clientX, clientY) {
      if (isGameOver || !hasRolled || isRolling) return;
      const activePlayer = activePlayers[currentTurnIndex];
      if (!activePlayer || !activePlayer.isMe) return;

      const color = activePlayer.color;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clickX = (clientX - rect.left) * scaleX;
      const clickY = (clientY - rect.top) * scaleY;

      let bestIdx = -1;
      let minDist = CELL * 1.6; // Generous hit radius for mobile fingertips

      for (let i = 0; i < tokens[color].length; i++) {
        const t = tokens[color][i];
        if (!canPawnMove(t, diceValue)) continue;

        const pos = getTokenPos(color, i);
        const cx = (pos.c + 0.5) * CELL;
        const cy = (pos.r + 0.5) * CELL;
        const dist = Math.hypot(clickX - cx, clickY - cy);

        if (dist < minDist) {
          minDist = dist;
          bestIdx = i;
        }
      }

      if (bestIdx !== -1) {
        clearAutoMoveTimer();
        executeMoveToken(color, bestIdx, diceValue, true);
      }
    }

    canvas.addEventListener('pointerdown', (e) => {
      handleBoardInteraction(e.clientX, e.clientY);
    });
    canvas.addEventListener('click', (e) => {
      handleBoardInteraction(e.clientX, e.clientY);
    });
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length > 0) {
        e.preventDefault();
        handleBoardInteraction(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    // Also support pointerdown on dice button for instant mobile reaction
    const diceWrapperEl = document.getElementById('diceTouchWrapper');
    if (diceWrapperEl) {
      diceWrapperEl.addEventListener('pointerdown', () => {
        onDiceClick();
      });
    }

    function executeMoveToken(color, tokenIndex, roll, isLocal, explicitNextTurn = null, isExtraTurn = false, exactStep = null, exactIsHome = null) {
      clearAutoMoveTimer();
      clearTurnSafetyTimer();

      const token = tokens[color] ? tokens[color][tokenIndex] : null;
      if (!token) return;

      if (exactStep !== null && exactStep !== undefined) {
        token.step = exactStep;
      } else {
        if (token.step === -1) {
          token.step = 0;
          playSfx('home');
        } else {
          token.step += roll;
          playSfx('move');
        }
      }

      if (exactIsHome !== null && exactIsHome !== undefined) {
        token.isHome = Boolean(exactIsHome);
      } else if (token.step >= 56) {
        token.step = 56;
        token.isHome = true;
        playSfx('home');
      }

      const captured = checkCapture(color, token);

      renderBoard();
      updateStatusBar();

      // Check Victory
      if (tokens[color].every(t => t.isHome)) {
        finishGame(color);
        if (isLocal && isPartyMode) {
          sendPartyAction({
            action: 'LUDO_MOVE',
            playerColor: color,
            tokenIndex: tokenIndex,
            roll: roll,
            tokenStep: token.step,
            tokenIsHome: token.isHome,
            captured: captured,
            isGameOver: true
          });
        }
        return;
      }

      const getsExtraTurn = (roll === 6 || captured);

      if (isLocal) {
        const nextTurn = getsExtraTurn ? currentTurnIndex : ((currentTurnIndex + 1) % activePlayers.length);
        if (isPartyMode) {
          sendPartyAction({
            action: 'LUDO_MOVE',
            playerColor: color,
            tokenIndex: tokenIndex,
            roll: roll,
            tokenStep: token.step,
            tokenIsHome: token.isHome,
            captured: captured,
            nextTurnIndex: nextTurn,
            extraTurn: getsExtraTurn
          });
        }

        if (getsExtraTurn) {
          hasRolled = false;
          diceValue = null;
          isRolling = false;
          updateTurnDisplay(true);
          startTurnSafetyTimer();
          maybeRunBotTurn();
        } else {
          advanceTurn(false);
        }
      } else {
        // Remote move applied
        if (explicitNextTurn !== null && explicitNextTurn !== undefined) {
          currentTurnIndex = explicitNextTurn;
        } else if (!isExtraTurn) {
          currentTurnIndex = (currentTurnIndex + 1) % activePlayers.length;
        }
        hasRolled = false;
        diceValue = null;
        isRolling = false;
        updateTurnDisplay(isExtraTurn);
        renderBoard();
        startTurnSafetyTimer();
        maybeRunBotTurn();
      }
    }

    function checkCapture(attackerPlayer, attackerToken) {
      if (attackerToken.step === -1 || attackerToken.isHome) return false;
      const attackerIdx = tokens[attackerPlayer].indexOf(attackerToken);
      const attPos = getTokenPos(attackerPlayer, attackerIdx);
      if (!attPos) return false;

      if (isSafeSquare(attPos.r, attPos.c)) return false;

      let didCapture = false;
      activePlayers.forEach(p => {
        if (p.color === attackerPlayer) return;
        tokens[p.color].forEach(defToken => {
          if (defToken.step === -1 || defToken.isHome) return;
          const defIdx = tokens[p.color].indexOf(defToken);
          const defPos = getTokenPos(p.color, defIdx);
          if (!defPos) return;

          if (attPos.r === defPos.r && attPos.c === defPos.c) {
            defToken.step = -1;
            defToken.isHome = false;
            didCapture = true;
            playSfx('capture');
            const hint = document.getElementById('actionHint');
            if (hint) hint.textContent = `💥 Captured ${p.color} Token!`;
          }
        });
      });

      return didCapture;
    }

    function advanceTurn(syncToParty = false) {
      clearAutoMoveTimer();
      clearTurnSafetyTimer();
      if (turnTimer) clearTimeout(turnTimer);
      if (remoteRollTimer) clearTimeout(remoteRollTimer);

      currentTurnIndex = (currentTurnIndex + 1) % activePlayers.length;
      hasRolled = false;
      diceValue = null;
      isRolling = false;
      updateTurnDisplay(false);
      renderBoard();

      if (syncToParty && isPartyMode) {
        sendPartyAction({
          action: 'LUDO_TURN_ADVANCE',
          nextTurnIndex: currentTurnIndex
        });
      }

      startTurnSafetyTimer();
      maybeRunBotTurn();
    }

    function maybeRunBotTurn() {
      const activePlayer = activePlayers[currentTurnIndex];
      if (!activePlayer || !activePlayer.isBot || isGameOver) return;
      if (isPartyMode && !isHost) return;

      const actionHint = document.getElementById('actionHint');
      if (actionHint) actionHint.textContent = `${activePlayer.username} is rolling...`;

      setTimeout(() => {
        if (isGameOver) return;
        const cube = document.getElementById('diceCube');
        if (cube) cube.classList.add('rolling');
        playSfx('roll');

        setTimeout(() => {
          const botRoll = Math.floor(Math.random() * 6) + 1;
          if (cube) cube.classList.remove('rolling');
          renderDiceFace(botRoll);
          diceValue = botRoll;
          hasRolled = true;
          const diceLabel = document.getElementById('diceLabel');
          if (diceLabel) diceLabel.textContent = `Bot Rolled: ${botRoll}`;

          if (isPartyMode) {
            sendPartyAction({
              action: 'LUDO_ROLL',
              roll: botRoll,
              playerIndex: currentTurnIndex,
              isBotMove: true
            });
          }

          const color = activePlayer.color;
          const movable = tokens[color]
            .map((t, idx) => ({ t, idx }))
            .filter(item => canPawnMove(item.t, botRoll));

          if (movable.length === 0) {
            if (actionHint) actionHint.textContent = `Bot rolled ${botRoll} (No moves)`;
            setTimeout(() => {
              advanceTurn(true);
            }, 1000);
          } else {
            const openMove = movable.find(m => m.t.step === -1);
            const chosen = openMove || movable[0];

            setTimeout(() => {
              executeMoveToken(color, chosen.idx, botRoll, true);
            }, 500);
          }
          renderBoard();
        }, 400);
      }, 900);
    }

    // -------------------------------------------------------------
    // MULTIPLAYER MESSAGING WITH PARENT WEBSOCKET
    // -------------------------------------------------------------
    function sendPartyAction(actionPayload) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'PARTY_ACTION',
          gameSlug: 'ludo-hero-ai',
          roomCode: urlParams.get('room') || window.parent?.activePartySession?.roomCode,
          ...actionPayload
        }, '*');
      }
    }

    function handleRemotePartyAction(data) {
      if (!data) return;

      if (data.action === 'LUDO_ROLL') {
        clearAutoMoveTimer();
        clearTurnSafetyTimer();
        if (turnTimer) clearTimeout(turnTimer);
        if (remoteRollTimer) clearTimeout(remoteRollTimer);

        if (data.playerIndex !== undefined) {
          currentTurnIndex = data.playerIndex;
        }
        const cube = document.getElementById('diceCube');
        if (cube) cube.classList.add('rolling');
        playSfx('roll');
        isRolling = true;

        remoteRollTimer = setTimeout(() => {
          diceValue = data.roll;
          if (cube) cube.classList.remove('rolling');
          renderDiceFace(diceValue);
          hasRolled = true;
          isRolling = false;
          const p = activePlayers[currentTurnIndex];
          const name = p ? p.username : 'Opponent';
          const diceLabel = document.getElementById('diceLabel');
          if (diceLabel) diceLabel.textContent = `${name} Rolled: ${diceValue}`;

          const color = p ? p.color : null;
          const movable = color ? tokens[color].filter(item => canPawnMove(item, diceValue)) : [];
          const noMoves = (data.noMoves !== undefined) ? data.noMoves : (movable.length === 0);

          if (noMoves) {
            const hint = document.getElementById('actionHint');
            if (hint) hint.textContent = `${name} has no moves for ${diceValue}.`;

            const nextIdx = (data.nextTurnIndex !== undefined) ? data.nextTurnIndex : ((currentTurnIndex + 1) % activePlayers.length);
            turnTimer = setTimeout(() => {
              currentTurnIndex = nextIdx;
              hasRolled = false;
              diceValue = null;
              isRolling = false;
              updateTurnDisplay(false);
              renderBoard();
              startTurnSafetyTimer();
              maybeRunBotTurn();
            }, 900);
          }
          renderBoard();
        }, 350);
      } else if (data.action === 'LUDO_MOVE') {
        clearAutoMoveTimer();
        clearTurnSafetyTimer();
        if (turnTimer) clearTimeout(turnTimer);
        if (remoteRollTimer) clearTimeout(remoteRollTimer);
        executeMoveToken(data.playerColor, data.tokenIndex, data.roll, false, data.nextTurnIndex, data.extraTurn, data.tokenStep, data.tokenIsHome);
      } else if (data.action === 'LUDO_TURN_ADVANCE') {
        clearAutoMoveTimer();
        clearTurnSafetyTimer();
        if (turnTimer) clearTimeout(turnTimer);
        if (remoteRollTimer) clearTimeout(remoteRollTimer);
        if (data.nextTurnIndex !== undefined) {
          currentTurnIndex = data.nextTurnIndex;
        } else {
          currentTurnIndex = (currentTurnIndex + 1) % activePlayers.length;
        }
        hasRolled = false;
        diceValue = null;
        isRolling = false;
        updateTurnDisplay(false);
        renderBoard();
        maybeRunBotTurn();
      }
    }

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'PARTY_GAME_UPDATE') {
        const payload = event.data.actionData || event.data;
        const sId = event.data.senderId || payload.senderId;
        if (sId && myUserId && String(sId) === String(myUserId)) {
          return;
        }
        handleRemotePartyAction(payload);
      }
    });

    function finishGame(winnerColor) {
      isGameOver = true;
      const winner = activePlayers.find(p => p.color === winnerColor) || { username: winnerColor };
      const modal = document.getElementById('winModal');
      const title = document.getElementById('modalTitle');
      const desc = document.getElementById('modalDesc');

      if (title) title.textContent = `🏆 ${winner.username} WINS!`;
      if (desc) desc.textContent = `All 4 ${winnerColor} tokens reached Home!`;
      if (modal) modal.classList.remove('hidden');
      playSfx('home');
    }

    function resetGame() {
      window.location.reload();
    }

    // Initialize
    updateTurnDisplay();
    renderBoard();
    maybeRunBotTurn();
  </script>
</body>
</html>
