<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classic Ludo — You vs Smart Computer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #111422;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      user-select: none;
      touch-action: manipulation;
    }
    
    /* 3D Classic White Dice with black pips */
    .dice-cube {
      width: 48px;
      height: 48px;
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 4px 0 #CBD5E1, 0 6px 12px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .dice-cube:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #CBD5E1, 0 3px 6px rgba(0,0,0,0.4);
    }
    
    @keyframes rollShake {
      0% { transform: rotate(0deg) scale(0.9); }
      20% { transform: rotate(-25deg) scale(1.1); }
      40% { transform: rotate(25deg) scale(1.15); }
      60% { transform: rotate(-15deg) scale(1.05); }
      80% { transform: rotate(15deg) scale(1.1); }
      100% { transform: rotate(0deg) scale(1); }
    }
    .rolling {
      animation: rollShake 0.4s ease-in-out;
    }

    .dice-pip {
      width: 8px;
      height: 8px;
      background: #1E293B;
      border-radius: 50%;
    }
    .red-pip {
      background: #DC2626 !important;
      width: 11px !important;
      height: 11px !important;
    }

    /* Pawn highlight glow */
    .movable-token {
      filter: drop-shadow(0 0 8px #FFD700) drop-shadow(0 0 14px #FF0000);
      cursor: pointer;
      animation: tokenBounce 0.8s infinite alternate ease-in-out;
    }
    @keyframes tokenBounce {
      0% { transform: scale(1); }
      100% { transform: scale(1.18); }
    }
  </style>
</head>
<body class="h-full w-full flex flex-col items-center justify-between p-1.5 sm:p-2.5 max-w-lg mx-auto box-border overflow-hidden">

  <!-- Top Status Bar -->
  <div class="w-full shrink-0 flex items-center justify-between bg-slate-900/90 border border-slate-700/60 px-3 py-1.5 rounded-xl shadow-lg">
    <!-- Player Indicator (Red) -->
    <div class="flex items-center gap-2">
      <div class="w-3.5 h-3.5 rounded-full bg-red-600 border-2 border-white shadow"></div>
      <div class="flex flex-col">
        <span class="text-[11px] font-bold text-red-400 leading-none">YOU (RED)</span>
        <span class="text-[9.5px] text-gray-400" id="redHomeCount">0 / 4 Home</span>
      </div>
    </div>

    <!-- Turn Message Banner -->
    <div class="px-2.5 py-0.5 rounded-lg bg-slate-800 border border-slate-700 text-center">
      <span class="text-[11px] font-extrabold uppercase tracking-wide text-amber-300" id="turnBanner">
        Your Turn — Roll Dice!
      </span>
    </div>

    <!-- AI Indicator (Green) -->
    <div class="flex items-center gap-2 text-right">
      <div class="flex flex-col">
        <span class="text-[11px] font-bold text-emerald-400 leading-none">AI BOT (GREEN)</span>
        <span class="text-[9.5px] text-gray-400" id="greenHomeCount">0 / 4 Home</span>
      </div>
      <div class="w-3.5 h-3.5 rounded-full bg-emerald-600 border-2 border-white shadow"></div>
    </div>
  </div>

  <!-- Real Authentic 15x15 Ludo Board (Responsive dynamic fit) -->
  <div class="flex-1 min-h-0 w-full flex items-center justify-center py-1 overflow-hidden">
    <div class="h-full aspect-square max-w-full p-1 sm:p-1.5 bg-slate-800 rounded-xl sm:rounded-2xl shadow-2xl border-2 sm:border-4 border-slate-700 flex items-center justify-center">
      <canvas id="ludoCanvas" class="w-full h-full rounded-lg sm:rounded-xl bg-white shadow-inner"></canvas>
    </div>
  </div>

  <!-- Bottom Control Deck: Real White Dice & Info -->
  <div class="w-full shrink-0 bg-slate-900/95 border border-slate-700/80 rounded-xl sm:rounded-2xl px-3 py-1.5 sm:py-2 flex items-center justify-between shadow-xl">
    
    <div class="flex flex-col max-w-[120px]">
      <span class="text-[10px] sm:text-[11px] font-bold text-gray-300" id="actionHint">Click dice to roll!</span>
      <span class="text-[9px] sm:text-[10px] text-gray-500">Roll 6 to open token</span>
    </div>

    <!-- The 3D Dice -->
    <div class="flex flex-col items-center">
      <div id="diceCube" onclick="onDiceClick()" class="dice-cube select-none">
        <!-- Pips rendered dynamically -->
        <div id="diceGrid" class="grid grid-cols-3 gap-1 p-1 w-full h-full items-center justify-items-center">
          <div class="col-start-2 dice-pip red-pip"></div>
        </div>
      </div>
      <span class="text-[9.5px] font-bold text-gray-400 mt-0.5 uppercase" id="diceLabel">Roll Dice</span>
    </div>

    <div class="flex flex-col text-right max-w-[120px]">
      <span class="text-[10px] sm:text-[11px] font-bold text-emerald-400">Rules Active</span>
      <span class="text-[9px] sm:text-[10px] text-gray-500">Safe stars & capture</span>
    </div>

  </div>

  <!-- Victory Win Modal -->
  <div id="winModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center space-y-4">
    <div class="w-20 h-20 rounded-2xl bg-amber-500/20 border-2 border-amber-400 flex items-center justify-center text-amber-400 text-4xl animate-bounce">
      <i class="fa-solid fa-trophy"></i>
    </div>
    <h2 class="font-black text-3xl text-white" id="modalTitle">🏆 YOU WON!</h2>
    <p class="text-xs text-gray-300" id="modalDesc">All your tokens successfully reached Home!</p>
    <div class="flex gap-3 w-full max-w-xs pt-2">
      <button onclick="resetGame()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-extrabold text-xs uppercase hover:opacity-90">
        Play Again
      </button>
      <button onclick="window.parent.closeGameTheater()" class="flex-1 py-3 rounded-xl bg-white/10 border border-white/20 text-white font-bold text-xs hover:bg-white/20">
        Exit to Lobby
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('ludoCanvas');
    const ctx = canvas.getContext('2d');

    // 15x15 standard Ludo grid
    const GRID_SIZE = 15;
    const CANVAS_SIZE = 600;
    canvas.width = CANVAS_SIZE;
    canvas.height = CANVAS_SIZE;
    const CELL = CANVAS_SIZE / GRID_SIZE; // 40px per square

    // Web Audio Sound Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSfx(type) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const t = audioCtx.currentTime;

        if (type === 'roll') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, t);
          osc.frequency.exponentialRampToValueAtTime(150, t + 0.15);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.linearRampToValueAtTime(0, t + 0.15);
          osc.start(t);
          osc.stop(t + 0.15);
        } else if (type === 'move') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(550, t);
          gain.gain.setValueAtTime(0.2, t);
          gain.gain.linearRampToValueAtTime(0, t + 0.08);
          osc.start(t);
          osc.stop(t + 0.08);
        } else if (type === 'capture') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, t);
          osc.frequency.exponentialRampToValueAtTime(700, t + 0.25);
          gain.gain.setValueAtTime(0.3, t);
          gain.gain.linearRampToValueAtTime(0, t + 0.25);
          osc.start(t);
          osc.stop(t + 0.25);
        } else if (type === 'home') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523, t);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.linearRampToValueAtTime(0, t + 0.3);
          osc.start(t);
          osc.stop(t + 0.3);
        }
      } catch (e) {}
    }

    // -------------------------------------------------------------
    // CLASSIC LUDO PATH COORDINATES (52 Common Squares + Home Run)
    // -------------------------------------------------------------
    // Full clockwise loop starting from Red's start (row 6, col 1) = index 0
    const TRACK_COORDS = [
      // Red arm bottom to top
      { r: 6, c: 1 }, { r: 6, c: 2 }, { r: 6, c: 3 }, { r: 6, c: 4 }, { r: 6, c: 5 },
      // Top arm left column going up
      { r: 5, c: 6 }, { r: 4, c: 6 }, { r: 3, c: 6 }, { r: 2, c: 6 }, { r: 1, c: 6 }, { r: 0, c: 6 },
      // Top edge
      { r: 0, c: 7 }, { r: 0, c: 8 },
      // Top arm right column going down (Green start at index 13: r 1, c 8)
      { r: 1, c: 8 }, { r: 2, c: 8 }, { r: 3, c: 8 }, { r: 4, c: 8 }, { r: 5, c: 8 },
      // Right arm top row going right
      { r: 6, c: 9 }, { r: 6, c: 10 }, { r: 6, c: 11 }, { r: 6, c: 12 }, { r: 6, c: 13 }, { r: 6, c: 14 },
      // Right edge
      { r: 7, c: 14 }, { r: 8, c: 14 },
      // Right arm bottom row going left
      { r: 8, c: 13 }, { r: 8, c: 12 }, { r: 8, c: 11 }, { r: 8, c: 10 }, { r: 8, c: 9 },
      // Bottom arm right column going down
      { r: 9, c: 8 }, { r: 10, c: 8 }, { r: 11, c: 8 }, { r: 12, c: 8 }, { r: 13, c: 8 }, { r: 14, c: 8 },
      // Bottom edge
      { r: 14, c: 7 }, { r: 14, c: 6 },
      // Bottom arm left column going up
      { r: 13, c: 6 }, { r: 12, c: 6 }, { r: 11, c: 6 }, { r: 10, c: 6 }, { r: 9, c: 6 },
      // Left arm bottom row going left
      { r: 8, c: 5 }, { r: 8, c: 4 }, { r: 8, c: 3 }, { r: 8, c: 2 }, { r: 8, c: 1 }, { r: 8, c: 0 },
      // Left edge
      { r: 7, c: 0 }
    ]; // Total 51 main track tiles + tile 0 = 52 tiles (0 to 51)

    // Red Home Run (5 tiles moving into center)
    const RED_HOME_PATH = [
      { r: 7, c: 1 }, { r: 7, c: 2 }, { r: 7, c: 3 }, { r: 7, c: 4 }, { r: 7, c: 5 }, { r: 7, c: 6 } // 6 is Center Home!
    ];

    // Green Home Run (5 tiles moving down into center)
    const GREEN_HOME_PATH = [
      { r: 1, c: 7 }, { r: 2, c: 7 }, { r: 3, c: 7 }, { r: 4, c: 7 }, { r: 5, c: 7 }, { r: 6, c: 7 } // Center Home!
    ];

    // Safe Squares (Star tiles where tokens cannot be captured)
    const SAFE_SQUARES = [
      { r: 6, c: 1 },  // Red Start
      { r: 2, c: 6 },  // Safe Star
      { r: 1, c: 8 },  // Green Start
      { r: 6, c: 12 }, // Safe Star
      { r: 8, c: 13 }, // Yellow Start
      { r: 12, c: 8 }, // Safe Star
      { r: 13, c: 6 }, // Blue Start
      { r: 8, c: 2 }   // Safe Star
    ];

    function isSafeSquare(r, c) {
      return SAFE_SQUARES.some(s => s.r === r && s.c === c);
    }

    // Base positions for 4 tokens in home boxes
    const RED_BASE_SLOTS = [
      { r: 2, c: 2 }, { r: 2, c: 3 }, { r: 3, c: 2 }, { r: 3, c: 3 }
    ];
    const GREEN_BASE_SLOTS = [
      { r: 2, c: 11 }, { r: 2, c: 12 }, { r: 3, c: 11 }, { r: 3, c: 12 }
    ];

    // Game Tokens State (4 Red Tokens & 4 Green Tokens)
    const tokens = {
      RED: [
        { id: 1, step: -1, isHome: false },
        { id: 2, step: -1, isHome: false },
        { id: 3, step: -1, isHome: false },
        { id: 4, step: -1, isHome: false }
      ],
      GREEN: [
        { id: 1, step: -1, isHome: false },
        { id: 2, step: -1, isHome: false },
        { id: 3, step: -1, isHome: false },
        { id: 4, step: -1, isHome: false }
      ]
    };

    let isPlayerTurn = true;
    let diceValue = null;
    let hasRolled = false;
    let isRolling = false;
    let isGameOver = false;

    // Helper: Get token row and col on the board
    function getTokenPos(player, tokenIndex) {
      const token = tokens[player][tokenIndex];
      if (token.isHome) {
        return { r: 7, c: 7 }; // Inside Center Home
      }
      if (token.step === -1) {
        // Inside Base box
        return player === 'RED' ? RED_BASE_SLOTS[tokenIndex] : GREEN_BASE_SLOTS[tokenIndex];
      }

      // Step is >= 0
      if (player === 'RED') {
        if (token.step < 51) {
          return TRACK_COORDS[token.step];
        } else {
          // Inside Red Home Run (step 51..56)
          const homeIndex = token.step - 51;
          return RED_HOME_PATH[Math.min(homeIndex, RED_HOME_PATH.length - 1)];
        }
      } else {
        // GREEN player starts at index 13 on the main track
        // Steps 0..50 correspond to (13 + step) % 52
        if (token.step < 51) {
          const trackIdx = (13 + token.step) % 52;
          return TRACK_COORDS[trackIdx];
        } else {
          // Inside Green Home Run
          const homeIndex = token.step - 51;
          return GREEN_HOME_PATH[Math.min(homeIndex, GREEN_HOME_PATH.length - 1)];
        }
      }
    }

    // -------------------------------------------------------------
    // DRAWING THE CLASSIC LUDO BOARD
    // -------------------------------------------------------------
    function renderBoard() {
      ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

      // 1. Draw 15x15 white grid with subtle borders
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

      ctx.strokeStyle = '#CBD5E1';
      ctx.lineWidth = 1;
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          ctx.strokeRect(c * CELL, r * CELL, CELL, CELL);
        }
      }

      // 2. Draw Colored Corner Bases
      // RED BASE (Top-Left 6x6)
      drawBaseBox(0, 0, '#DC2626', RED_BASE_SLOTS);
      // GREEN BASE (Top-Right 6x6)
      drawBaseBox(9, 0, '#16A34A', GREEN_BASE_SLOTS);
      // BLUE BASE (Bottom-Left 6x6)
      drawBaseBox(0, 9, '#2563EB', []);
      // YELLOW BASE (Bottom-Right 6x6)
      drawBaseBox(9, 9, '#CA8A04', []);

      // 3. Draw Colored Home Rows & Paths
      // Red Start Square (row 6, col 1) & Home Row (row 7, col 1..5)
      fillCell(6, 1, '#DC2626');
      drawStar(6, 1, '#FFFFFF');
      for (let c = 1; c <= 5; c++) fillCell(7, c, '#DC2626');

      // Green Start Square (row 1, col 8) & Home Row (col 7, row 1..5)
      fillCell(1, 8, '#16A34A');
      drawStar(1, 8, '#FFFFFF');
      for (let r = 1; r <= 5; r++) fillCell(r, 7, '#16A34A');

      // Yellow Start Square (row 8, col 13) & Home Row (row 7, col 9..13)
      fillCell(8, 13, '#CA8A04');
      drawStar(8, 13, '#FFFFFF');
      for (let c = 9; c <= 13; c++) fillCell(7, c, '#CA8A04');

      // Blue Start Square (row 13, col 6) & Home Row (col 7, row 9..13)
      fillCell(13, 6, '#2563EB');
      drawStar(13, 6, '#FFFFFF');
      for (let r = 9; r <= 13; r++) fillCell(r, 7, '#2563EB');

      // Safe Stars
      SAFE_SQUARES.forEach(s => {
        if (!((s.r === 6 && s.c === 1) || (s.r === 1 && s.c === 8) || (s.r === 8 && s.c === 13) || (s.r === 13 && s.c === 6))) {
          drawStar(s.r, s.c, '#94A3B8');
        }
      });

      // 4. Center Home Triangles (Center 3x3)
      drawCenterHome();

      // 5. Draw Pawns / Tokens
      drawAllPawns();
    }

    function drawBaseBox(startCol, startRow, color, slots) {
      const x = startCol * CELL;
      const y = startRow * CELL;
      const w = 6 * CELL;
      const h = 6 * CELL;

      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);

      // Inner white area
      const pad = CELL;
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(x + pad, y + pad, w - pad * 2, h - pad * 2);

      // Circular pawn home seats
      slots.forEach(slot => {
        const cx = (slot.c + 0.5) * CELL;
        const cy = (slot.r + 0.5) * CELL;
        ctx.beginPath();
        ctx.arc(cx, cy, CELL * 0.38, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      });
    }

    function fillCell(r, c, color) {
      ctx.fillStyle = color;
      ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
      ctx.strokeStyle = '#CBD5E1';
      ctx.lineWidth = 1;
      ctx.strokeRect(c * CELL, r * CELL, CELL, CELL);
    }

    function drawStar(r, c, color) {
      const cx = (c + 0.5) * CELL;
      const cy = (r + 0.5) * CELL;
      const spikes = 5;
      const outerRadius = CELL * 0.32;
      const innerRadius = CELL * 0.16;
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    function drawCenterHome() {
      const cx = 7.5 * CELL;
      const cy = 7.5 * CELL;
      const left = 6 * CELL;
      const right = 9 * CELL;
      const top = 6 * CELL;
      const bottom = 9 * CELL;

      // Red Triangle (Left)
      ctx.beginPath();
      ctx.moveTo(left, top);
      ctx.lineTo(cx, cy);
      ctx.lineTo(left, bottom);
      ctx.closePath();
      ctx.fillStyle = '#DC2626';
      ctx.fill();

      // Green Triangle (Top)
      ctx.beginPath();
      ctx.moveTo(left, top);
      ctx.lineTo(cx, cy);
      ctx.lineTo(right, top);
      ctx.closePath();
      ctx.fillStyle = '#16A34A';
      ctx.fill();

      // Yellow Triangle (Right)
      ctx.beginPath();
      ctx.moveTo(right, top);
      ctx.lineTo(cx, cy);
      ctx.lineTo(right, bottom);
      ctx.closePath();
      ctx.fillStyle = '#CA8A04';
      ctx.fill();

      // Blue Triangle (Bottom)
      ctx.beginPath();
      ctx.moveTo(left, bottom);
      ctx.lineTo(cx, cy);
      ctx.lineTo(right, bottom);
      ctx.closePath();
      ctx.fillStyle = '#2563EB';
      ctx.fill();
    }

    // Draw Classic 3D Pawn Shape
    function drawAllPawns() {
      // 1. Draw Green Pawns (AI)
      tokens.GREEN.forEach((t, i) => {
        const pos = getTokenPos('GREEN', i);
        drawClassicPawn(pos.r, pos.c, '#16A34A', '#15803D', false);
      });

      // 2. Draw Red Pawns (Player)
      tokens.RED.forEach((t, i) => {
        const pos = getTokenPos('RED', i);
        const canMove = isPlayerTurn && hasRolled && canPawnMove(t, diceValue);
        drawClassicPawn(pos.r, pos.c, '#DC2626', '#B91C1C', canMove);
      });
    }

    function drawClassicPawn(r, c, baseColor, darkColor, isMovable) {
      const cx = (c + 0.5) * CELL;
      const cy = (r + 0.5) * CELL;

      ctx.save();
      if (isMovable) {
        // Movable yellow halo
        ctx.beginPath();
        ctx.arc(cx, cy, CELL * 0.46, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 215, 0, 0.45)';
        ctx.fill();
        ctx.strokeStyle = '#F59E0B';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }

      // Shadow
      ctx.beginPath();
      ctx.ellipse(cx, cy + CELL * 0.3, CELL * 0.28, CELL * 0.12, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fill();

      // Pawn Base Skirt
      ctx.beginPath();
      ctx.arc(cx, cy + CELL * 0.18, CELL * 0.32, 0, Math.PI * 2);
      ctx.fillStyle = darkColor;
      ctx.fill();

      // Pawn Body Collar
      ctx.beginPath();
      ctx.arc(cx, cy - CELL * 0.05, CELL * 0.24, 0, Math.PI * 2);
      ctx.fillStyle = baseColor;
      ctx.fill();

      // Pawn Head Ball
      ctx.beginPath();
      ctx.arc(cx, cy - CELL * 0.15, CELL * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy - CELL * 0.15, CELL * 0.17, 0, Math.PI * 2);
      ctx.fillStyle = baseColor;
      ctx.fill();

      // White Shine on head
      ctx.beginPath();
      ctx.arc(cx - CELL * 0.06, cy - CELL * 0.2, CELL * 0.05, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.fill();

      ctx.restore();
    }

    function canPawnMove(token, roll) {
      if (token.isHome) return false;
      if (token.step === -1) return roll === 6; // Needs a 6 to open
      return (token.step + roll) <= 56; // 56 is Exact Center Home
    }

    // -------------------------------------------------------------
    // DICE LOGIC & PIPS RENDERING
    // -------------------------------------------------------------
    function renderDiceFace(val) {
      const grid = document.getElementById('diceGrid');
      const pipMap = {
        1: '<div class="col-start-2 row-start-2 dice-pip red-pip"></div>',
        2: '<div class="col-start-1 row-start-1 dice-pip"></div><div class="col-start-3 row-start-3 dice-pip"></div>',
        3: '<div class="col-start-1 row-start-1 dice-pip"></div><div class="col-start-2 row-start-2 dice-pip"></div><div class="col-start-3 row-start-3 dice-pip"></div>',
        4: '<div class="col-start-1 row-start-1 dice-pip"></div><div class="col-start-3 row-start-1 dice-pip"></div><div class="col-start-1 row-start-3 dice-pip"></div><div class="col-start-3 row-start-3 dice-pip"></div>',
        5: '<div class="col-start-1 row-start-1 dice-pip"></div><div class="col-start-3 row-start-1 dice-pip"></div><div class="col-start-2 row-start-2 dice-pip"></div><div class="col-start-1 row-start-3 dice-pip"></div><div class="col-start-3 row-start-3 dice-pip"></div>',
        6: '<div class="col-start-1 row-start-1 dice-pip"></div><div class="col-start-3 row-start-1 dice-pip"></div><div class="col-start-1 row-start-2 dice-pip"></div><div class="col-start-3 row-start-2 dice-pip"></div><div class="col-start-1 row-start-3 dice-pip"></div><div class="col-start-3 row-start-3 dice-pip"></div>'
      };
      grid.innerHTML = pipMap[val] || pipMap[1];
    }

    function onDiceClick() {
      if (!isPlayerTurn || hasRolled || isRolling || isGameOver) return;
      isRolling = true;

      const cube = document.getElementById('diceCube');
      cube.classList.add('rolling');
      playSfx('roll');

      setTimeout(() => {
        diceValue = Math.floor(Math.random() * 6) + 1;
        cube.classList.remove('rolling');
        renderDiceFace(diceValue);
        hasRolled = true;
        isRolling = false;

        document.getElementById('diceLabel').textContent = `Rolled: ${diceValue}`;

        // Check player movable pawns
        const movable = tokens.RED.filter(t => canPawnMove(t, diceValue));

        if (movable.length === 0) {
          document.getElementById('actionHint').textContent = `No moves available for ${diceValue}.`;
          setTimeout(switchTurnToAI, 1100);
        } else if (movable.length === 1) {
          // Auto move single option
          document.getElementById('actionHint').textContent = `Moving Token ${movable[0].id}...`;
          setTimeout(() => movePlayerToken(movable[0]), 400);
        } else {
          document.getElementById('actionHint').textContent = "Select glowing token to move!";
        }

        renderBoard();
      }, 400);
    }

    // Board touch & click interaction
    function handleBoardInteraction(clientX, clientY) {
      if (!isPlayerTurn || !hasRolled || isGameOver) return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clickX = (clientX - rect.left) * scaleX;
      const clickY = (clientY - rect.top) * scaleY;

      // Find clicked Red token
      for (let i = 0; i < tokens.RED.length; i++) {
        const t = tokens.RED[i];
        if (!canPawnMove(t, diceValue)) continue;

        const pos = getTokenPos('RED', i);
        const cx = (pos.c + 0.5) * CELL;
        const cy = (pos.r + 0.5) * CELL;

        if (Math.hypot(clickX - cx, clickY - cy) < CELL * 0.75) {
          movePlayerToken(t);
          break;
        }
      }
    }

    canvas.addEventListener('click', (e) => {
      handleBoardInteraction(e.clientX, e.clientY);
    });

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length > 0) {
        e.preventDefault();
        handleBoardInteraction(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    function movePlayerToken(token) {
      if (token.step === -1) {
        token.step = 0; // Open to start square (row 6, col 1)
        playSfx('home');
      } else {
        token.step += diceValue;
        playSfx('move');
      }

      if (token.step === 56) {
        token.isHome = true;
        playSfx('home');
      }

      // Check for Capture on opponent Green token
      checkCapture('RED', token);

      updateScores();
      renderBoard();

      // Check Victory Condition (All 4 Home)
      if (tokens.RED.every(t => t.isHome)) {
        finishGame(true);
        return;
      }

      // If player rolled 6, extra roll awarded!
      if (diceValue === 6) {
        hasRolled = false;
        document.getElementById('actionHint').textContent = "🎉 Rolled a 6! Roll again!";
        document.getElementById('turnBanner').textContent = "Extra Turn Awarded!";
      } else {
        switchTurnToAI();
      }
    }

    function checkCapture(attackerPlayer, attackerToken) {
      if (attackerToken.step === -1 || attackerToken.isHome) return;

      // Get attacker coordinate
      const attackerIdx = tokens[attackerPlayer].indexOf(attackerToken);
      const attPos = getTokenPos(attackerPlayer, attackerIdx);

      // Safe square immunity check!
      if (isSafeSquare(attPos.r, attPos.c)) return;

      const defenderPlayer = attackerPlayer === 'RED' ? 'GREEN' : 'RED';

      tokens[defenderPlayer].forEach((defToken, idx) => {
        if (defToken.step === -1 || defToken.isHome) return;
        const defPos = getTokenPos(defenderPlayer, idx);

        if (attPos.r === defPos.r && attPos.c === defPos.c) {
          // CAPTURE! Sent back to base!
          defToken.step = -1;
          playSfx('capture');
          document.getElementById('actionHint').textContent = `💥 Captured ${defenderPlayer} Pawn!`;
        }
      });
    }

    function switchTurnToAI() {
      isPlayerTurn = false;
      hasRolled = false;
      diceValue = null;
      document.getElementById('turnBanner').textContent = "AI BOT (GREEN) THINKING...";
      document.getElementById('actionHint').textContent = "AI is rolling...";
      document.getElementById('diceLabel').textContent = "AI Turn";
      renderBoard();

      setTimeout(runAiTurn, 1000);
    }

    // -------------------------------------------------------------
    // SMART COMPUTER AI BOT LOGIC
    // -------------------------------------------------------------
    function runAiTurn() {
      if (isGameOver) return;

      const cube = document.getElementById('diceCube');
      cube.classList.add('rolling');
      playSfx('roll');

      setTimeout(() => {
        const aiRoll = Math.floor(Math.random() * 6) + 1;
        cube.classList.remove('rolling');
        renderDiceFace(aiRoll);
        document.getElementById('diceLabel').textContent = `AI Rolled: ${aiRoll}`;

        const movable = tokens.GREEN.filter(t => canPawnMove(t, aiRoll));

        if (movable.length === 0) {
          document.getElementById('actionHint').textContent = `AI rolled ${aiRoll} (No moves)`;
          setTimeout(switchTurnToPlayer, 1000);
        } else {
          // Smart AI Decision:
          // Priority 1: Check if any move captures a Red pawn
          let chosen = null;
          for (const t of movable) {
            const nextStep = (t.step === -1) ? 0 : (t.step + aiRoll);
            const testIdx = (13 + nextStep) % 52;
            const testCoord = (nextStep < 51) ? TRACK_COORDS[testIdx] : GREEN_HOME_PATH[Math.min(nextStep - 51, GREEN_HOME_PATH.length - 1)];

            if (!isSafeSquare(testCoord.r, testCoord.c)) {
              const canHit = tokens.RED.some((rt, ri) => {
                if (rt.step === -1 || rt.isHome) return false;
                const rPos = getTokenPos('RED', ri);
                return rPos.r === testCoord.r && rPos.c === testCoord.c;
              });
              if (canHit) {
                chosen = t;
                break;
              }
            }
          }

          // Priority 2: Deploy token from base if 6 rolled
          if (!chosen && aiRoll === 6) {
            chosen = movable.find(t => t.step === -1);
          }

          // Priority 3: Move token that is closest to Home
          if (!chosen) {
            chosen = movable.reduce((prev, curr) => (curr.step > prev.step ? curr : prev));
          }

          setTimeout(() => {
            if (chosen.step === -1) {
              chosen.step = 0;
              playSfx('home');
            } else {
              chosen.step += aiRoll;
              playSfx('move');
            }

            if (chosen.step === 56) {
              chosen.isHome = true;
              playSfx('home');
            }

            checkCapture('GREEN', chosen);
            updateScores();
            renderBoard();

            // Check AI Win
            if (tokens.GREEN.every(t => t.isHome)) {
              finishGame(false);
              return;
            }

            // If AI rolled 6, extra turn!
            if (aiRoll === 6) {
              document.getElementById('actionHint').textContent = "AI rolled 6! Extra turn!";
              setTimeout(runAiTurn, 1000);
            } else {
              setTimeout(switchTurnToPlayer, 900);
            }
          }, 500);
        }
      }, 400);
    }

    function switchTurnToPlayer() {
      isPlayerTurn = true;
      hasRolled = false;
      diceValue = null;
      document.getElementById('turnBanner').textContent = "Your Turn — Roll Dice!";
      document.getElementById('actionHint').textContent = "Click dice to roll!";
      document.getElementById('diceLabel').textContent = "Roll Dice";
      renderBoard();
    }

    function updateScores() {
      const redHome = tokens.RED.filter(t => t.isHome).length;
      const greenHome = tokens.GREEN.filter(t => t.isHome).length;
      document.getElementById('redHomeCount').textContent = `${redHome} / 4 Home`;
      document.getElementById('greenHomeCount').textContent = `${greenHome} / 4 Home`;
    }

    function finishGame(playerWon) {
      isGameOver = true;
      const modal = document.getElementById('winModal');
      const title = document.getElementById('modalTitle');
      const desc = document.getElementById('modalDesc');

      if (playerWon) {
        title.textContent = "🏆 YOU WON!";
        title.className = "font-black text-3xl text-amber-400 animate-bounce";
        desc.textContent = "All 4 of your Red Pawns reached Home! Excellent strategy!";
      } else {
        title.textContent = "DEFEAT!";
        title.className = "font-black text-3xl text-red-500";
        desc.textContent = "The Smart Computer AI got all tokens Home first!";
      }

      modal.classList.remove('hidden');
    }

    function resetGame() {
      document.getElementById('winModal').classList.add('hidden');
      tokens.RED.forEach(t => { t.step = -1; t.isHome = false; });
      tokens.GREEN.forEach(t => { t.step = -1; t.isHome = false; });
      isPlayerTurn = true;
      hasRolled = false;
      isGameOver = false;
      diceValue = null;
      renderDiceFace(1);
      updateScores();
      switchTurnToPlayer();
      renderBoard();
    }

    // Initialize board on load
    renderDiceFace(1);
    renderBoard();
  </script>
</body>
</html>
