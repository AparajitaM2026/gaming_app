<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kokpar Nomad Rider — Central Asian Steppe Chase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Inter:wght@400;600;700;800&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #022c22;
      font-family: 'Inter', sans-serif;
      color: #fff;
      user-select: none;
      touch-action: none;
    }
    .cinzel { font-family: 'Cinzel', serif; }
    .orbitron { font-family: 'Orbitron', sans-serif; }

    #steppeCanvas {
      background: linear-gradient(180deg, #064e3b 0%, #047857 35%, #059669 70%, #047857 100%);
      box-shadow: inset 0 0 50px rgba(0,0,0,0.85);
    }
  </style>
</head>
<body class="h-full w-full flex flex-col justify-between p-2 sm:p-3 max-w-md mx-auto box-border overflow-hidden">

  <!-- Header -->
  <header class="w-full shrink-0 flex items-center justify-between bg-teal-950/80 border border-teal-500/30 px-3 py-1.5 sm:px-4 sm:py-2 rounded-2xl shadow-xl backdrop-blur-md">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🇰🇿</span>
      <div>
        <h1 class="cinzel font-black text-xs sm:text-sm text-teal-300 tracking-wider leading-none">
          KOKPAR NOMAD RIDER
        </h1>
        <span class="text-[9.5px] text-teal-400 font-bold uppercase tracking-widest">Steppe Horse Chase</span>
      </div>
    </div>

    <!-- Stats -->
    <div class="flex items-center gap-3">
      <div class="text-right">
        <span class="text-[9px] text-gray-400 uppercase font-bold block">Score</span>
        <span id="scoreDisplay" class="orbitron text-xs sm:text-sm font-black text-amber-300">0</span>
      </div>
      <div class="text-right">
        <span class="text-[9px] text-gray-400 uppercase font-bold block">Kazan Goal</span>
        <span id="goalsDisplay" class="orbitron text-xs sm:text-sm font-black text-emerald-400">0</span>
      </div>
    </div>
  </header>

  <!-- Interactive 2D Canvas -->
  <main class="flex-1 w-full my-1 relative flex items-center justify-center overflow-hidden">
    <canvas id="steppeCanvas" class="w-full h-full rounded-2xl border-2 border-teal-600/40 shadow-2xl"></canvas>
  </main>

  <!-- Footer Touch Navigation Buttons -->
  <footer class="w-full shrink-0 py-1.5 px-3 rounded-xl bg-teal-950/90 border border-white/10 text-[10px] sm:text-xs text-teal-200/80 flex items-center justify-between gap-2">
    <button onclick="movePlayer(-1)" class="w-1/3 py-2 rounded-xl bg-teal-700/80 hover:bg-teal-600 active:scale-95 text-white font-black text-sm flex items-center justify-center gap-1 shadow">
      <i class="fa-solid fa-arrow-left"></i>
      <span>LEFT</span>
    </button>
    <button onclick="jumpPlayer()" class="w-1/3 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 active:scale-95 text-black font-black text-sm flex items-center justify-center gap-1 shadow">
      <span>JUMP 🐎</span>
    </button>
    <button onclick="movePlayer(1)" class="w-1/3 py-2 rounded-xl bg-teal-700/80 hover:bg-teal-600 active:scale-95 text-white font-black text-sm flex items-center justify-center gap-1 shadow">
      <span>RIGHT</span>
      <i class="fa-solid fa-arrow-right"></i>
    </button>
  </footer>

  <!-- End Game Modal -->
  <div id="endModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-gradient-to-b from-teal-950 to-stone-950 border-2 border-teal-400 p-6 rounded-3xl max-w-sm w-full text-center shadow-2xl space-y-4">
      <div id="endEmoji" class="text-5xl">🐎</div>
      <h2 id="endTitle" class="cinzel text-xl font-black text-teal-300">NOMAD CHAMPION!</h2>
      <p id="endDesc" class="text-xs text-teal-100 font-medium leading-relaxed">
        You galloped across the steppe and delivered the trophy to the Kazan!
      </p>
      <div class="py-2 px-4 rounded-xl bg-black/50 border border-teal-500/40 flex justify-around text-xs font-bold">
        <div>Score: <span id="finalScore" class="text-amber-400 font-black text-base">0</span></div>
      </div>
      <button onclick="resetGame()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-teal-400 to-emerald-500 text-black font-black text-xs tracking-wider uppercase shadow-lg active:scale-95 transition-all">
        Ride Again
      </button>
    </div>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playSfx(type) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const t = audioCtx.currentTime;

        if (type === 'gallop') {
          osc.frequency.setValueAtTime(160, t);
          gain.gain.setValueAtTime(0.15, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.06);
          osc.start(t);
          osc.stop(t + 0.06);
        } else if (type === 'goal') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, t);
          osc.frequency.linearRampToValueAtTime(1040, t + 0.3);
          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
          osc.start(t);
          osc.stop(t + 0.4);
        } else if (type === 'crash') {
          osc.frequency.setValueAtTime(120, t);
          gain.gain.setValueAtTime(0.4, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
          osc.start(t);
          osc.stop(t + 0.2);
        }
      } catch (e) {}
    }

    const canvas = document.getElementById('steppeCanvas');
    const ctx = canvas.getContext('2d');

    let W = 360;
    let H = 540;
    let score = 0;
    let goals = 0;
    let gameOver = false;

    // Player Steppe Horse Rider
    let player = {
      x: 180,
      y: 440,
      targetX: 180,
      jumpY: 0,
      jumpVy: 0,
      isJumping: false,
      radius: 20
    };

    // Steppe Objects (Obstacles & Golden Tamgas & Kazans)
    let objects = [];
    let speed = 4;
    let spawnTimer = 0;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      W = canvas.width = rect.width * window.devicePixelRatio;
      H = canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      W = rect.width;
      H = rect.height;

      player.x = W / 2;
      player.targetX = W / 2;
      player.y = H * 0.82;
    }

    function movePlayer(dir) {
      if (gameOver) return;
      const step = W * 0.28;
      player.targetX = Math.max(W * 0.18, Math.min(W * 0.82, player.targetX + dir * step));
      playSfx('gallop');
    }

    function jumpPlayer() {
      if (player.isJumping || gameOver) return;
      player.isJumping = true;
      player.jumpVy = -9;
      playSfx('gallop');
    }

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1);
      if (e.key === 'ArrowRight' || e.key === 'd') movePlayer(1);
      if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') jumpPlayer();
    });

    function spawnObject() {
      const lanes = [W * 0.22, W * 0.5, W * 0.78];
      const lane = lanes[Math.floor(Math.random() * lanes.length)];
      const rand = Math.random();

      if (rand < 0.45) {
        // Golden Steppe Tamga (+50 pts)
        objects.push({ type: 'tamga', x: lane, y: -30, radius: 14 });
      } else if (rand < 0.75) {
        // Boulder Obstacle
        objects.push({ type: 'rock', x: lane, y: -30, radius: 16 });
      } else {
        // Kazan Goal Ring (+200 pts)
        objects.push({ type: 'kazan', x: lane, y: -40, radius: 24 });
      }
    }

    function update() {
      if (gameOver) return;

      // Smooth horizontal motion
      player.x += (player.targetX - player.x) * 0.2;

      // Jumping physics
      if (player.isJumping) {
        player.jumpY += player.jumpVy;
        player.jumpVy += 0.5;
        if (player.jumpY >= 0) {
          player.jumpY = 0;
          player.jumpVy = 0;
          player.isJumping = false;
        }
      }

      // Spawning
      spawnTimer++;
      if (spawnTimer > 45) {
        spawnTimer = 0;
        spawnObject();
      }

      // Move objects down
      for (let i = objects.length - 1; i >= 0; i--) {
        const obj = objects[i];
        obj.y += speed;

        // Collision with player
        const dist = Math.hypot(obj.x - player.x, obj.y - (player.y + player.jumpY));
        if (dist < obj.radius + player.radius) {
          if (obj.type === 'tamga') {
            score += 50;
            document.getElementById('scoreDisplay').textContent = score;
            playSfx('gallop');
            objects.splice(i, 1);
            continue;
          } else if (obj.type === 'kazan') {
            goals++;
            score += 200;
            document.getElementById('goalsDisplay').textContent = goals;
            document.getElementById('scoreDisplay').textContent = score;
            playSfx('goal');
            objects.splice(i, 1);
            continue;
          } else if (obj.type === 'rock') {
            // If not jumping high enough -> Crash!
            if (player.jumpY > -15) {
              gameOver = true;
              playSfx('crash');
              endGame();
              return;
            }
          }
        }

        // Out of screen
        if (obj.y > H + 50) {
          objects.splice(i, 1);
          score += 10;
          document.getElementById('scoreDisplay').textContent = score;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Draw Steppe Lane Lines
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 2;
      ctx.setLineDash([12, 10]);
      ctx.beginPath();
      ctx.moveTo(W * 0.36, 0); ctx.lineTo(W * 0.36, H);
      ctx.moveTo(W * 0.64, 0); ctx.lineTo(W * 0.64, H);
      ctx.stroke();
      ctx.restore();

      // Draw Objects
      for (const obj of objects) {
        ctx.save();
        if (obj.type === 'tamga') {
          ctx.beginPath();
          ctx.arc(obj.x, obj.y, obj.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#facc15';
          ctx.shadowColor = '#fde047';
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = '#78350f';
          ctx.font = "bold 12px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("★", obj.x, obj.y + 4);
        } else if (obj.type === 'rock') {
          ctx.beginPath();
          ctx.arc(obj.x, obj.y, obj.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#64748b';
          ctx.shadowColor = '#000';
          ctx.shadowBlur = 6;
          ctx.fill();
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 2;
          ctx.stroke();
        } else if (obj.type === 'kazan') {
          ctx.beginPath();
          ctx.arc(obj.x, obj.y, obj.radius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(16, 185, 129, 0.3)';
          ctx.fill();
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 4;
          ctx.stroke();
          ctx.fillStyle = '#a7f3d0';
          ctx.font = "bold 10px Orbitron";
          ctx.textAlign = "center";
          ctx.fillText("KAZAN", obj.x, obj.y + 4);
        }
        ctx.restore();
      }

      // Draw Steppe Stallion Rider
      ctx.save();
      const actualY = player.y + player.jumpY;
      ctx.beginPath();
      ctx.arc(player.x, actualY, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#b45309';
      ctx.shadowColor = '#d97706';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.font = "20px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("🐎", player.x, actualY + 7);
      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function endGame() {
      document.getElementById('finalScore').textContent = score;
      document.getElementById('endModal').classList.remove('hidden');
    }

    function resetGame() {
      score = 0;
      goals = 0;
      gameOver = false;
      objects = [];
      player.targetX = W / 2;
      player.x = W / 2;
      document.getElementById('scoreDisplay').textContent = 0;
      document.getElementById('goalsDisplay').textContent = 0;
      document.getElementById('endModal').classList.add('hidden');
    }

    window.addEventListener('resize', resize);
    resize();
    loop();
  </script>
</body>
</html>
